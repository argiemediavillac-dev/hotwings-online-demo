<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Hotwings Online ordering prototype for Hotwings, Polomolok. Menu and prices from the Hotwings Facebook menu (Jan 2024); orders, payments and tracking are simulated.">
<meta name="theme-color" content="#171514">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font-size:14px}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Hotwings Online</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Figtree:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: phone-first customer column (560px), wide ops board for staff, narrow rider column. DEMO THEME: charcoal + fiery orange placeholders until brand is approved. */
:root{
  --bg:#f4f3f1; --surface:#ffffff; --surface-2:#efedea; --ink:#1e1b19; --muted:#655e59; --line:#dfdad5;
  --brand:#cf2a1f; --brand-ink:#ffffff; --brand-soft:#fde4e1; --accent:#f6b800; --char:#171514; --char-ink:#f7f2ea;
  --ok:#1d7a45; --warn:#9a5b00; --bad:#bf2a2a; --info:#2155b8;
  --map-bg:#e9ece4; --map-road:#ffffff; --map-road2:#d3d7cc; --map-zone:#d9480f; --map-label:#6b7064;
  --food-1:#c4621c; --food-2:#e8a33d; --food-3:#7b3913; --food-4:#f3dfb8; --art-bg:#f7e6d6;
  --shadow:0 1px 2px rgb(30 20 10 / .06), 0 4px 16px rgb(30 20 10 / .06);
  --f-display:"Anton","Impact","Arial Narrow",sans-serif;
  --f-body:"Figtree",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  --r:12px; --r-sm:8px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#141210; --surface:#1f1c1a; --surface-2:#292523; --ink:#f3eee9; --muted:#a8a09a; --line:#3a3431;
  --brand:#ff5a47; --brand-ink:#1a0806; --brand-soft:#3b1a16; --accent:#ffc61a; --char:#0b0a09; --char-ink:#f7f2ea;
  --ok:#4cc483; --warn:#f0b04a; --bad:#ff7a70; --info:#7ea7ff;
  --map-bg:#22261f; --map-road:#3b4036; --map-road2:#2e322a; --map-zone:#ff6b2c; --map-label:#9aa092;
  --art-bg:#3a2a1f; --shadow:0 1px 2px rgb(0 0 0 / .4), 0 4px 16px rgb(0 0 0 / .3); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141210; --surface:#1f1c1a; --surface-2:#292523; --ink:#f3eee9; --muted:#a8a09a; --line:#3a3431;
  --brand:#ff5a47; --brand-ink:#1a0806; --brand-soft:#3b1a16; --accent:#ffc61a; --char:#0b0a09; --char-ink:#f7f2ea;
  --ok:#4cc483; --warn:#f0b04a; --bad:#ff7a70; --info:#7ea7ff;
  --map-bg:#22261f; --map-road:#3b4036; --map-road2:#2e322a; --map-zone:#ff6b2c; --map-label:#9aa092;
  --art-bg:#3a2a1f; --shadow:0 1px 2px rgb(0 0 0 / .4), 0 4px 16px rgb(0 0 0 / .3); color-scheme:dark}

*{box-sizing:border-box}
html,body{background:var(--bg)}
body{color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--char)}
h1,h2,h3{margin:0;text-wrap:balance}
.display{font-family:var(--f-display);font-weight:400;letter-spacing:.01em;text-transform:uppercase;line-height:1.02}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:6px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.small{font-size:13px}
.xs{font-size:12px}
.eyebrow{font-size:11.5px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.gutter{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.stack{display:flex;flex-direction:column;gap:12px}
.stack-lg{display:flex;flex-direction:column;gap:20px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
.grow{flex:1;min-width:0}
.hr{height:1px;background:var(--line);border:0;margin:4px 0}

/* demo bar */
.demobar{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;background:var(--char);color:var(--char-ink)}
.demobar-in{max-width:1280px;margin:0 auto;display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding-block:8px}
.demo-tag{font-family:var(--f-mono);font-size:11px;font-weight:700;background:var(--accent);color:#1a1200;padding:3px 7px;border-radius:4px;letter-spacing:.06em}
.demo-msg{font-size:12.5px;opacity:.85;flex:1;min-width:160px}
.roles{display:flex;gap:4px;flex-wrap:wrap}
.roles button{background:transparent;border:1px solid rgb(255 255 255 / .2);color:var(--char-ink);border-radius:999px;padding:6px 11px;min-height:36px;font-size:13px;font-weight:600;cursor:pointer}
.roles button[aria-pressed="true"]{background:var(--char-ink);color:var(--char);border-color:var(--char-ink)}
.demobar .guide-btn{background:var(--brand);color:#fff;border:0;border-radius:999px;padding:6px 14px;min-height:36px;font-weight:700;font-size:13px;cursor:pointer}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 16px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-weight:700;cursor:pointer;text-decoration:none;color:var(--ink);white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn-primary{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.btn-primary:hover{filter:brightness(1.05);border-color:var(--brand)}
.btn-dark{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.btn-danger{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 40%,var(--line))}
.btn-ghost{background:transparent;border-color:transparent}
.btn-sm{min-height:36px;padding:0 12px;font-size:13.5px;border-radius:8px}
.btn-block{width:100%}
.linkbtn{background:none;border:0;color:var(--brand);font-weight:700;cursor:pointer;padding:6px 0;min-height:36px;text-decoration:underline;text-underline-offset:3px}

/* pills */
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;padding:3px 9px;border-radius:999px;white-space:nowrap;border:1px solid transparent}
.pill::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.t-ok{color:var(--ok);background:color-mix(in srgb,var(--ok) 13%,var(--surface))}
.t-warn{color:var(--warn);background:color-mix(in srgb,var(--warn) 14%,var(--surface))}
.t-bad{color:var(--bad);background:color-mix(in srgb,var(--bad) 12%,var(--surface))}
.t-info{color:var(--info);background:color-mix(in srgb,var(--info) 12%,var(--surface))}
.t-brand{color:var(--brand);background:var(--brand-soft)}
.t-mute{color:var(--muted);background:var(--surface-2)}
.demo-chip{font-family:var(--f-mono);font-size:10.5px;font-weight:700;letter-spacing:.06em;color:var(--warn);border:1px dashed currentColor;border-radius:4px;padding:1px 5px;white-space:nowrap}

/* cards & notices */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.notice{border-radius:10px;padding:11px 13px;font-size:13.5px;border:1px solid;display:flex;gap:10px;align-items:flex-start}
.notice b{font-weight:700}
.n-info{border-color:color-mix(in srgb,var(--info) 35%,var(--line));background:color-mix(in srgb,var(--info) 7%,var(--surface))}
.n-warn{border-color:color-mix(in srgb,var(--warn) 40%,var(--line));background:color-mix(in srgb,var(--warn) 8%,var(--surface))}
.n-bad{border-color:color-mix(in srgb,var(--bad) 40%,var(--line));background:color-mix(in srgb,var(--bad) 7%,var(--surface))}
.n-ok{border-color:color-mix(in srgb,var(--ok) 40%,var(--line));background:color-mix(in srgb,var(--ok) 7%,var(--surface))}

/* forms */
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field label,.lbl{font-size:13px;font-weight:700}
.field .hint{font-size:12.5px;color:var(--muted)}
input[type=text],input[type=tel],input[type=number],input[type=search],select,textarea{width:100%;min-height:44px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface);}
textarea{min-height:70px;resize:vertical}
input:focus,select:focus,textarea:focus{border-color:var(--brand);outline:none;box-shadow:0 0 0 3px color-mix(in srgb,var(--brand) 22%,transparent)}
.seg{display:flex;background:var(--surface-2);border-radius:12px;padding:4px;gap:4px}
.seg button{flex:1;min-height:42px;border:0;border-radius:9px;background:transparent;font-weight:700;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--surface);box-shadow:var(--shadow)}
.seg button[disabled]{opacity:.4;cursor:not-allowed}
.choice{display:flex;align-items:center;gap:10px;min-height:46px;padding:8px 12px;border:1px solid var(--line);border-radius:10px;cursor:pointer;background:var(--surface)}
.choice:has(input:checked){border-color:var(--brand);background:var(--brand-soft)}
.choice.off{opacity:.5;cursor:not-allowed}
.choice input{accent-color:var(--brand);width:18px;height:18px;flex:none}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:520px){.grid2{grid-template-columns:1fr}}
.switch{display:inline-flex;align-items:center;gap:10px;cursor:pointer;min-height:44px}
.switch input{appearance:none;width:44px;height:26px;border-radius:999px;background:var(--line);position:relative;cursor:pointer;flex:none;transition:background .15s}
.switch input::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:var(--surface);box-shadow:0 1px 2px rgb(0 0 0 /.3);transition:transform .15s}
.switch input:checked{background:var(--ok)}
.switch input:checked::after{transform:translateX(18px)}

/* customer shell */
.cwrap{max-width:560px;margin:0 auto;padding-block:16px 120px}
.chead{background:var(--surface);border-bottom:1px solid var(--line)}
.chead-in{max-width:560px;margin:0 auto;display:flex;align-items:center;gap:12px;padding-block:10px}
.logo{display:flex;align-items:center;gap:9px;text-decoration:none;color:var(--ink)}
.logo-mark{width:38px;height:38px;border-radius:10px;background:var(--brand);display:grid;place-items:center}
.wm{font-family:var(--f-display);font-style:italic;line-height:.86;display:inline-flex;flex-direction:column;transform:skewX(-6deg);letter-spacing:.02em;font-size:21px;color:var(--accent);text-shadow:-1.5px -1.5px 0 var(--brand),1.5px -1.5px 0 var(--brand),-1.5px 1.5px 0 var(--brand),1.5px 1.5px 0 var(--brand),2px 3px 0 var(--char)}
.wm span+span{margin-left:6px}
.logo-word{font-family:var(--f-display);font-size:21px;line-height:1;letter-spacing:.02em}
.logo-sub{font-size:10.5px;color:var(--muted);font-weight:700;letter-spacing:.05em;text-transform:uppercase}
.cnav{max-width:560px;margin:0 auto;display:flex;gap:2px;overflow-x:auto}
.cnav a{padding:10px 12px;min-height:44px;display:flex;align-items:center;text-decoration:none;color:var(--muted);font-weight:700;font-size:14px;border-bottom:3px solid transparent;white-space:nowrap}
.cnav a[aria-current="page"]{color:var(--ink);border-bottom-color:var(--brand)}
.hero{background:var(--char);color:var(--char-ink);border-radius:18px;overflow:hidden;display:grid;grid-template-columns:1.15fr 1fr;align-items:stretch}
.hero-copy{padding:22px 4px 22px 20px;display:flex;flex-direction:column;gap:12px;justify-content:center}
.hero h1{font-size:clamp(30px,8vw,44px)}
.hero h1 span{color:var(--accent)}
.hero .art{height:100%;min-height:170px;border-radius:0}
@media (max-width:400px){.hero{grid-template-columns:1fr}.hero .art{min-height:130px}}
.statusbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.cats{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.cats button{flex:none;min-height:40px;padding:0 15px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-weight:700;cursor:pointer}
.cats button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.items{display:flex;flex-direction:column;gap:10px}
.item{display:grid;grid-template-columns:1fr 112px;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px;cursor:pointer;text-align:left;width:100%}
.item:hover{border-color:var(--muted)}
.item .art{width:112px;height:96px;border-radius:10px}
.item h3{font-size:16px;font-weight:800}
.item.sold{cursor:default}
.item.sold .art{filter:grayscale(1);opacity:.6}
.item .price{font-weight:800}
.desc{font-size:13.5px;color:var(--muted);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.art{display:block;width:100%;background:var(--art-bg)}
img.art.photo{object-fit:cover;aspect-ratio:4/3;height:auto}
.item img.art.photo{width:112px;height:96px;aspect-ratio:auto;border-radius:10px}
.hero img.art.photo{height:100%;aspect-ratio:auto;border-radius:0}
.sheet-b > img.art.photo{border-radius:12px;max-height:320px}
.logo-img{border-radius:10px;object-fit:contain;background:#fff;flex:none}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px}
.pcard{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden;display:flex;flex-direction:column;min-width:0}
.pcard-img{display:block;width:100%;aspect-ratio:1;object-fit:cover;background:var(--surface-2)}
.pcard-img .art{height:100%}
.thumb{width:48px;height:40px;object-fit:cover;border-radius:6px;display:block}
.art .f1{fill:var(--food-1)}.art .f2{fill:var(--food-2)}.art .f3{fill:var(--food-3)}.art .f4{fill:var(--food-4)}
.art .bgc{fill:var(--art-bg)}
.art .lbl{fill:var(--food-3);font:700 8px var(--f-mono);letter-spacing:.06em;opacity:.75}
.secthead{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.secthead h2{font-size:24px}

.cartbar{position:fixed;left:0;right:0;bottom:0;z-index:40;padding-bottom:calc(12px + env(safe-area-inset-bottom,0px));padding-top:12px;background:linear-gradient(to top,var(--bg) 70%,transparent)}
.cartbar-in{max-width:560px;margin:0 auto}
.cartbar .btn{width:100%;min-height:54px;font-size:16px;justify-content:space-between;border-radius:14px;box-shadow:var(--shadow)}
.qty{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.qty button{width:44px;height:44px;border:0;background:var(--surface);font-size:20px;font-weight:700;cursor:pointer}
.qty button[disabled]{opacity:.35}
.qty span{min-width:34px;text-align:center;font-weight:800}
.sum{display:grid;grid-template-columns:1fr auto;gap:6px 12px;font-variant-numeric:tabular-nums}
.sum .tot{font-weight:800;font-size:18px;padding-top:8px;border-top:1px solid var(--line)}
.line{display:grid;grid-template-columns:1fr auto;gap:4px 12px;padding:12px 0;border-bottom:1px solid var(--line)}
.line:last-child{border-bottom:0}

/* timeline */
.tl{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.tl li{display:grid;grid-template-columns:22px 1fr auto;gap:10px;align-items:start;position:relative;padding-bottom:14px}
.tl li::before{content:"";position:absolute;left:10px;top:20px;bottom:0;width:2px;background:var(--line)}
.tl li:last-child::before{display:none}
.tl .dot{width:22px;height:22px;border-radius:50%;border:2px solid var(--line);background:var(--surface);display:grid;place-items:center;font-size:12px;font-weight:800}
.tl li.done .dot{background:var(--ok);border-color:var(--ok);color:var(--surface)}
.tl li.done::before{background:var(--ok)}
.tl li.now .dot{border-color:var(--brand);box-shadow:0 0 0 4px var(--brand-soft)}
.tl li.now .tl-t{font-weight:800}
.tl li.ex .dot{background:var(--bad);border-color:var(--bad);color:var(--surface)}
.tl .tl-t{font-weight:600}
.eta{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.eta>div{background:var(--surface-2);border-radius:10px;padding:12px;min-width:0}
.eta .big{font-family:var(--f-display);font-size:26px;line-height:1.1;letter-spacing:.01em}
@media (max-width:380px){.eta{grid-template-columns:1fr}}

/* map */
.mapbox{position:relative;border-radius:12px;overflow:hidden;border:1px solid var(--line);background:var(--map-bg)}
.mapbox svg{display:block;width:100%;height:auto}
.mapbox .maptag{position:absolute;left:8px;top:8px;font-family:var(--f-mono);font-size:10.5px;font-weight:700;background:var(--accent);color:#1a1200;padding:3px 7px;border-radius:4px;letter-spacing:.05em}
.m-bg{fill:var(--map-bg)}.m-road{stroke:var(--map-road);stroke-linecap:round}.m-road2{stroke:var(--map-road2)}
.m-zone{fill:color-mix(in srgb,var(--map-zone) 7%,transparent);stroke:var(--map-zone);stroke-dasharray:5 5;stroke-width:1.4}
.m-lbl{fill:var(--map-label);font:600 8.5px var(--f-body)}
.m-route{fill:none;stroke:var(--brand);stroke-width:4;stroke-linecap:round;stroke-linejoin:round;opacity:.85}
.m-store{fill:var(--char);stroke:var(--surface);stroke-width:2}
.m-store-t{fill:var(--accent);font:700 9px var(--f-mono)}
.m-dest{fill:var(--info);stroke:var(--surface);stroke-width:2}
.m-rider{fill:var(--brand);stroke:var(--surface);stroke-width:2.5}
.m-rider-stale{fill:var(--surface);stroke:var(--muted);stroke-width:2.5;stroke-dasharray:3 2}
.m-acc{fill:color-mix(in srgb,var(--brand) 14%,transparent);stroke:none}
.m-other{fill:var(--info);stroke:var(--surface);stroke-width:2}
.m-rlbl{fill:var(--ink);font:700 9px var(--f-body);paint-order:stroke;stroke:var(--map-bg);stroke-width:3px}
.mapbox.picking svg{cursor:crosshair}
.rider-g{transition:transform 1.2s linear}
@media (prefers-reduced-motion:reduce){.rider-g{transition:none}}

/* staff */
.swrap{max-width:1280px;margin:0 auto;padding-block:16px 60px}
.stabs{background:var(--surface);border-bottom:1px solid var(--line)}
.stabs-in{max-width:1280px;margin:0 auto;display:flex;gap:2px;overflow-x:auto;align-items:center}
.stabs a{padding:12px 13px;min-height:46px;display:flex;align-items:center;gap:7px;text-decoration:none;color:var(--muted);font-weight:700;white-space:nowrap;border-bottom:3px solid transparent}
.stabs a[aria-current="page"]{color:var(--ink);border-bottom-color:var(--brand)}
.badge{min-width:20px;height:20px;padding:0 6px;border-radius:999px;background:var(--brand);color:var(--brand-ink);font-size:11.5px;display:inline-grid;place-items:center;font-weight:800}
.kanban{display:grid;grid-template-columns:repeat(5,minmax(230px,1fr));gap:12px;overflow-x:auto;padding-bottom:8px}
.kcol{background:var(--surface-2);border-radius:14px;padding:10px;display:flex;flex-direction:column;gap:8px;min-height:180px;min-width:0}
.kcol h3{font-size:13px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;display:flex;justify-content:space-between;padding:2px 4px 4px}
.kcol.flash{animation:flash 1.2s ease 2}
@keyframes flash{50%{background:var(--brand-soft)}}
@media (prefers-reduced-motion:reduce){.kcol.flash{animation:none;outline:3px solid var(--brand)}}
.ocard{background:var(--surface);border:1px solid var(--line);border-radius:11px;padding:11px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:6px;width:100%}
.ocard:hover{border-color:var(--muted)}
.ocard.urgent{border-color:var(--bad);box-shadow:inset 4px 0 0 var(--bad)}
.ocard .code{font-family:var(--f-mono);font-weight:700;font-size:14px}
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
th{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:700;background:var(--surface-2)}
tr:last-child td{border-bottom:0}
td.r,th.r{text-align:right}
.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:13px;min-width:0}
.kpi .v{font-family:var(--f-display);font-size:28px;line-height:1.1;letter-spacing:.01em;font-variant-numeric:tabular-nums}
.sgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:14px;align-items:start}
@media (max-width:400px){.sgrid{grid-template-columns:1fr}}

/* rider */
.rwrap{max-width:520px;margin:0 auto;padding-block:16px 60px}
.rhead{background:var(--char);color:var(--char-ink);border-radius:16px;padding:14px 16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.rhead select{background:var(--char);color:var(--char-ink);border-color:rgb(255 255 255 /.25);width:auto}
.steps{display:flex;gap:4px}
.steps i{flex:1;height:5px;border-radius:3px;background:var(--line)}
.steps i.on{background:var(--brand)}
.pinput{font-family:var(--f-mono);font-size:24px;letter-spacing:.4em;text-align:center}

/* modal */
.scrim{position:fixed;inset:0;background:rgb(10 8 6 / .55);z-index:70;display:flex;align-items:flex-end;justify-content:center}
@media (min-width:700px){.scrim{align-items:center;padding:24px}}
.sheet{background:var(--bg);width:100%;max-width:560px;max-height:92vh;border-radius:20px 20px 0 0;display:flex;flex-direction:column;overflow:hidden}
.sheet.wide{max-width:820px}
@media (min-width:700px){.sheet{border-radius:20px}}
.sheet-h{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line);background:var(--surface)}
.sheet-h h2{font-size:18px;font-weight:800;flex:1;min-width:0}
.sheet-b{overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:16px}
.sheet-f{padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);background:var(--surface)}
.xbtn{width:44px;height:44px;border-radius:50%;border:0;background:var(--surface-2);font-size:22px;cursor:pointer;line-height:1}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(440px,100%);background:var(--bg);z-index:80;box-shadow:-10px 0 40px rgb(0 0 0 /.25);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px)}
.scen{border:1px solid var(--line);border-radius:12px;background:var(--surface);padding:13px}
.scen ol{margin:8px 0 0;padding-left:20px;display:flex;flex-direction:column;gap:6px;font-size:13.5px}
.scen li.done{color:var(--muted);text-decoration:line-through}
.chk{display:grid;grid-template-columns:24px 1fr;gap:8px;padding:8px 0;border-bottom:1px solid var(--line);font-size:13.5px}
.toasts{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:90;display:flex;flex-direction:column;gap:8px;width:min(480px,calc(100% - 32px))}
.toast{background:var(--ink);color:var(--bg);padding:12px 14px;border-radius:12px;font-weight:600;font-size:14px;box-shadow:var(--shadow)}
.toast.bad{background:var(--bad);color:#fff}
.autopilot{position:fixed;left:50%;transform:translateX(-50%);top:calc(64px + env(safe-area-inset-top,0px));z-index:65;background:var(--char);color:var(--char-ink);border-radius:999px;padding:8px 8px 8px 16px;display:flex;gap:10px;align-items:center;box-shadow:var(--shadow);width:max-content;max-width:calc(100% - 32px);font-size:13px}
.autopilot b{color:var(--accent)}
.offline-banner{background:var(--warn);color:var(--surface);text-align:center;font-weight:700;font-size:13px;padding:7px 16px}
.empty{text-align:center;padding:30px 16px;color:var(--muted)}
.proof{width:96px;height:96px;object-fit:cover;border-radius:8px;border:1px solid var(--line)}
.kv{display:grid;grid-template-columns:max-content 1fr;gap:4px 14px;font-size:14px}
.kv dt{color:var(--muted)}
.kv dd{margin:0;min-width:0;overflow-wrap:anywhere}
.h2{font-size:17px;font-weight:800}
.hb{display:flex;flex-direction:column;gap:7px}
.hb-row{display:grid;grid-template-columns:minmax(110px,40%) 1fr 13ch;gap:10px;align-items:center;font-size:13px}
.hb-l{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hb-t{height:14px;background:var(--surface-2);border-radius:4px;overflow:hidden}
.hb-t i{display:block;height:100%;background:var(--brand);border-radius:0 4px 4px 0}
.hb-v{font-weight:700;white-space:nowrap;text-align:right}
.vb{display:flex;align-items:flex-end;gap:6px;overflow-x:auto}
.vb-c{flex:1;min-width:30px;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:3px;height:100%}
.vb-c i{display:block;width:70%;max-width:44px;background:var(--brand);border-radius:4px 4px 0 0}
.vb-l{font-size:11.5px;color:var(--muted)}
.vb-v{font-size:10.5px;color:var(--muted);white-space:nowrap}
svg.me{width:100%;max-width:680px;margin:0 auto;min-width:480px;height:auto;display:block}
.me .ax{stroke:var(--line);stroke-width:1.5}.me .qd{stroke:var(--muted);stroke-dasharray:4 4;stroke-width:1}
.me .ql{fill:var(--muted);font:700 10px var(--f-mono);letter-spacing:.08em}.me .at{fill:var(--muted);font:600 11px var(--f-body)}
.me .pt{fill:var(--brand);stroke:var(--surface);stroke-width:2}
.me .pl{fill:var(--ink);font:600 10.5px var(--f-body);paint-order:stroke;stroke:var(--surface);stroke-width:3px}
textarea.csv{font-family:var(--f-mono);font-size:12px;min-height:160px;white-space:pre}
</style>
</head>
<body>
<div id="top"></div>
<div id="app"></div>
<div id="cartbar"></div>
<div id="overlay"></div>
<div id="toasts" class="toasts" aria-live="polite"></div>

<script>
"use strict";
/* =========================================================
   Utilities
   ========================================================= */
const TZ = 'Asia/Manila';
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
const peso = c => '₱' + (Math.round(c) / 100).toLocaleString('en-PH', {minimumFractionDigits: 2, maximumFractionDigits: 2});
const ALPH = 'abcdefghjkmnpqrstuvwxyz23456789';
const rid = (n = 8) => Array.from(crypto.getRandomValues(new Uint8Array(n)), b => ALPH[b % ALPH.length]).join('');
const fmtClock = t => new Intl.DateTimeFormat('en-PH', {timeZone: TZ, hour: 'numeric', minute: '2-digit'}).format(t);
const fmtDT = t => new Intl.DateTimeFormat('en-PH', {timeZone: TZ, month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit'}).format(t);
function ago(t) { const s = Math.max(0, Math.round((Date.now() - t) / 1000)); if (s < 60) return s + 's ago'; const m = Math.floor(s / 60); if (m < 60) return m + ' min ago'; return Math.floor(m / 60) + ' h ago'; }
const minsFromNow = t => Math.max(0, Math.round((t - Date.now()) / 60000));
const dist = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);
function normPhone(p) { const d = String(p || '').replace(/\D/g, ''); if (/^09\d{9}$/.test(d)) return d; if (/^639\d{9}$/.test(d)) return '0' + d.slice(2); return null; }
const maskPhone = p => p ? p.slice(0, 4) + ' *** ' + p.slice(-4) : '';
const maskName = n => String(n || '').split(/\s+/).filter(Boolean).map((w, i) => i === 0 ? w[0] + '***' : w[0] + '.').join(' ');
function manilaHM(t = Date.now()) { const parts = new Intl.DateTimeFormat('en-GB', {timeZone: TZ, hour: '2-digit', minute: '2-digit', hourCycle: 'h23'}).formatToParts(t); const h = +parts.find(p => p.type === 'hour').value, m = +parts.find(p => p.type === 'minute').value; return h * 60 + m; }
const hmToMin = s => { const [h, m] = String(s).split(':').map(Number); return h * 60 + (m || 0); };
const sleep = ms => new Promise(r => setTimeout(r, ms));

/* Schematic map geometry: 400×300 units, 1 unit = 25 m (demo only) */
const UNIT_KM = 0.025;
function routePath(store, dest) { return [store, {x: dest.x, y: store.y}, dest]; }
function pathLen(pts) { let L = 0; for (let i = 1; i < pts.length; i++) L += dist(pts[i - 1], pts[i]); return L; }
function pointAt(pts, d) { for (let i = 1; i < pts.length; i++) { const a = pts[i - 1], b = pts[i], L = dist(a, b); if (d <= L) { const t = L ? d / L : 0; return {x: a.x + (b.x - a.x) * t, y: a.y + (b.y - a.y) * t}; } d -= L; } return {...pts[pts.length - 1]}; }
function remainingAlong(pts, p) { let best = {d2: Infinity, along: 0}, acc = 0; for (let i = 1; i < pts.length; i++) { const a = pts[i - 1], b = pts[i], L = dist(a, b); let t = L ? ((p.x - a.x) * (b.x - a.x) + (p.y - a.y) * (b.y - a.y)) / (L * L) : 0; t = Math.max(0, Math.min(1, t)); const q = {x: a.x + (b.x - a.x) * t, y: a.y + (b.y - a.y) * t}; const d2 = (q.x - p.x) ** 2 + (q.y - p.y) ** 2; if (d2 < best.d2) best = {d2, along: acc + t * L}; acc += L; } return Math.max(0, acc - best.along); }

   ========================================================= */

const PS = {UNPAID: 'Unpaid', AWAITING_VERIFICATION: 'Awaiting verification', PAID: 'Paid', FAILED: 'Proof rejected', REFUND_PENDING: 'Refund pending', REFUNDED: 'Refunded'};
const PS_TONE = {UNPAID: 'warn', AWAITING_VERIFICATION: 'info', PAID: 'ok', FAILED: 'bad', REFUND_PENDING: 'warn', REFUNDED: 'mute'};
const PM = {COD: 'Cash on delivery', CASH_PICKUP: 'Cash on pickup', GCASH: 'GCash (manual)'};
const DS = {OFFERED: 'Offer sent', ACCEPTED: 'Rider accepted', AT_STORE: 'Rider at store', COLLECTED: 'Order collected', EN_ROUTE: 'On the way', ARRIVED: 'Rider arrived', DELIVERED: 'Delivered', FAILED: 'Delivery failed', DECLINED: 'Declined', CANCELLED: 'Cancelled'};

const AV_TONE = {AVAILABLE: 'ok', LOW_STOCK: 'warn', SOLD_OUT: 'bad', HIDDEN: 'mute'};
const ROLE_LABEL = {customer: 'Customer', cashier: 'Kitchen', manager: 'Manager', admin: 'Admin', rider: 'Rider'};
const TERMINAL = ['DELIVERED', 'COMPLETED', 'REJECTED', 'CANCELLED', 'DELIVERY_FAILED'];
const KITCHEN_ACTIVE = ['PLACED', 'ACCEPTED', 'PREPARING'];
const D_ACTIVE = ['OFFERED', 'ACCEPTED', 'AT_STORE', 'COLLECTED', 'EN_ROUTE', 'ARRIVED'];
const D_ONJOB = ['ACCEPTED', 'AT_STORE', 'COLLECTED', 'EN_ROUTE', 'ARRIVED'];

const MGR = ['manager', 'admin'];
const FLOW = {PLACED: ['ACCEPTED', 'REJECTED', 'CANCELLED'], ACCEPTED: ['PREPARING', 'CANCELLED'], PREPARING: ['READY', 'CANCELLED'], READY: ['OUT_FOR_DELIVERY', 'COMPLETED', 'CANCELLED'], OUT_FOR_DELIVERY: ['DELIVERED', 'DELIVERY_FAILED'], DELIVERED: [], COMPLETED: [], REJECTED: [], CANCELLED: [], DELIVERY_FAILED: []};

class ApiError extends Error { constructor(status, msg, data) { super(msg); this.status = status; this.data = data; } }
function need(actor, roles, what = 'do this') { if (!actor || !roles.includes(actor.role)) throw new ApiError(403, `Your role can't ${what}.`); }

class Api {
  constructor(state, onChange) { this.s = state; this.onChange = onChange || (() => {}); }
  now() { return Date.now(); }
  emit(topic, data) { this.onChange(topic, data); }
  who(a) { return a ? (a.role === 'rider' ? (this.rider(a.id)?.name || a.id) : a.role === 'customer' ? 'Customer' : ROLE_LABEL[a.role] + ' (demo)') : 'System'; }
  audit(actor, entity, entityId, action, meta = {}) { this.s.audit.unshift({id: rid(6), actor: this.who(actor), role: actor?.role || 'system', entity, entityId, action, meta, at: this.now()}); if (this.s.audit.length > 500) this.s.audit.length = 500; }
  product(id) { return this.s.products.find(p => p.id === id); }
  order(id) { return this.s.orders.find(o => o.id === id); }
  orderByCode(code) { return this.s.orders.find(o => o.code === String(code || '').trim().toUpperCase()); }
  payment(orderId) { return this.s.payments.find(p => p.orderId === orderId); }
  rider(id) { return this.s.riders.find(r => r.id === id); }
  deliveryFor(orderId) { const ds = this.s.deliveries.filter(d => d.orderId === orderId); return ds.find(d => D_ACTIVE.includes(d.status)) || ds[ds.length - 1] || null; }
  latestLoc(dId) { let best = null; for (const l of this.s.locations) if (l.deliveryId === dId && (!best || l.recordedAt > best.recordedAt)) best = l; return best; }

  availability(p) {
    if (!p.active || p.availability === 'HIDDEN') return 'HIDDEN';
    if (p.availability === 'SOLD_OUT') return 'SOLD_OUT';
    const inv = this.s.inventory[p.id];
    if (inv) { const a = inv.onHand - inv.reserved; if (a <= 0) return 'SOLD_OUT'; if (a <= 3) return 'LOW_STOCK'; }
    return p.availability === 'LOW_STOCK' ? 'LOW_STOCK' : 'AVAILABLE';
  }
  stockLeft(pid) { const inv = this.s.inventory[pid]; return inv ? inv.onHand - inv.reserved : null; }

  storeStatus() {
    const st = this.s.store;
    const t = manilaHM(), open = hmToMin(st.hours.open), close = hmToMin(st.hours.close);
    const inHours = open <= close ? (t >= open && t < close) : (t >= open || t < close);
    const kitchenLoad = this.s.orders.filter(o => KITCHEN_ACTIVE.includes(o.status)).length;
    let canOrder = true, reason = '', label = 'Open', tone = 'ok';
    if (st.paused) { canOrder = false; label = 'Ordering paused'; tone = 'warn'; reason = 'The store has paused new orders for now. Existing orders are still being tracked.'; }
    else if (st.enforceHours && !inHours) { canOrder = false; label = 'Closed'; tone = 'bad'; reason = `The store is closed. Ordering hours: ${st.hours.open}–${st.hours.close} (Manila time).`; }
    else if (kitchenLoad >= st.maxActive) { canOrder = false; label = 'Kitchen full'; tone = 'warn'; reason = 'The kitchen is at capacity. Try again in a few minutes.'; }
    else if (!st.acceptsDelivery && !st.acceptsPickup) { canOrder = false; label = 'Not taking orders'; tone = 'warn'; reason = 'Delivery and pickup are both off right now.'; }
    return {canOrder, reason, label, tone, inHours, kitchenLoad, delivery: st.acceptsDelivery, pickup: st.acceptsPickup, enforceHours: st.enforceHours, hours: st.hours};
  }

  }

    const queueMin = Math.ceil(ahead * 6 / Math.max(1, st.staffOnDuty));

        const valid = sel.map(cid => g.choices.find(c => c.id === cid)).filter(Boolean);

        if (g.type === 'single' && valid.length > 1) lp.push(`${p.name}: choose only one ${g.label.toLowerCase()}.`);
        if (g.required && !valid.length) lp.push(`${p.name}: choose a ${g.label.toLowerCase()}.`);
        if (g.max && valid.length > g.max) lp.push(`${p.name}: pick up to ${g.max} ${g.label.toLowerCase()}.`);
        for (const c of valid) { if (!c.available) lp.push(`${p.name}: ${c.label} is unavailable right now.`); unit += c.deltaC; chosen.push({gid: g.id, cid: c.id, group: g.label, label: c.label, deltaC: c.deltaC}); }
      }
      qtyBy[p.id] = (qtyBy[p.id] || 0) + (qty || 0);
      const lineC = unit * (qty || 0);
      lines.push({idx, productId: p.id, name: p.name, qty, unitC: unit, lineC, options: chosen, notes: String(it.notes || '').slice(0, 140), problems: lp});
      lp.forEach(m => problems.push({code: 'LINE', line: idx, msg: m}));
      if (!lp.length) subtotal += lineC;
    });
    for (const [pid, q] of Object.entries(qtyBy)) {
      const left = this.stockLeft(pid);
      if (left !== null && left > 0 && q > left) problems.push({code: 'STOCK', msg: `Only ${left} ${this.product(pid).name} left. Lower the quantity.`});
    }
    let schedAt = null;
    if (lines.some(l => this.product(l.productId)?.preorder)) {
      schedAt = scheduledFor ? Date.parse(String(scheduledFor).length <= 16 ? scheduledFor + ':00+08:00' : scheduledFor) : NaN;
      if (!(schedAt >= this.now() + 24 * 3600000)) problems.push({code: 'PREORDER', msg: 'Trays, packages and packed meals are pre-order only. Choose a date and time at least 24 hours ahead; the store confirms the schedule.'});
    }
    let zone = null, feeC = 0, routeKm = null;
    if (orderType === 'delivery') {
      if (!address || !address.barangay) problems.push({code: 'ADDR', msg: 'Choose your barangay.'});
      else {
        zone = s.zones.find(z => z.id === address.barangay);
        if (!zone) problems.push({code: 'ZONE', msg: 'That area is outside our delivery zones. Pickup is available.'});
        else if (!zone.enabled) problems.push({code: 'ZONE', msg: `We don't deliver to ${zone.label} right now. Pickup is available.`});
        else feeC = zone.feeC;
      }
      if (!address || !address.pin) problems.push({code: 'PIN', msg: 'Drop a pin on the map at your exact location.'});
      else if (dist(address.pin, s.storePos) > s.serviceRadius) problems.push({code: 'ZONE', msg: 'Your pin is outside the delivery area. Move the pin inside the dashed circle or choose pickup.'});
      else routeKm = +(pathLen(routePath(s.storePos, address.pin)) * UNIT_KM).toFixed(2);
      if (zone && zone.enabled && subtotal > 0 && subtotal < zone.minC) problems.push({code: 'MIN', msg: `Minimum order for delivery to ${zone.label} is ${peso(zone.minC)}. Add ${peso(zone.minC - subtotal)} more.`});
    }

    if (orderType === 'delivery' && routeKm != null) {
      if (s.demo.routeOutage) delivery = {lo: 15, hi: 35, fallback: true};

  }

  placeOrder(req, actor = {role: 'customer', id: 'guest'}) {
    const s = this.s;
    if (req.idemKey && s.idem[req.idemKey]) { const o = this.order(s.idem[req.idemKey]); return {code: o.code, token: o.token, replay: true}; }
    const q = this.quote(req);
    if (q.blocking) throw new ApiError(409, q.problems[0].msg, {quote: q});
    if (req.expectedTotalC !== q.totalC) throw new ApiError(409, `The total changed to ${peso(q.totalC)}. Review your order and place it again.`, {quote: q});
    const name = String(req.customer?.name || '').trim();
    if (name.length < 2) throw new ApiError(422, 'Enter your name.');
    const phone = normPhone(req.customer?.phone);
    if (!phone) throw new ApiError(422, 'Enter a Philippine mobile number, for example 0917 123 4567.');
    if (req.orderType === 'delivery' && !String(req.address?.text || '').trim()) throw new ApiError(422, 'Enter your street, house number or building.');
    const allowed = req.orderType === 'delivery' ? ['COD', 'GCASH'] : ['CASH_PICKUP', 'GCASH'];
    if (!allowed.includes(req.paymentMethod)) throw new ApiError(422, 'Choose a payment method.');
    if (!req.consent) throw new ApiError(422, 'Agree to the privacy notice to place your order.');
    const recent = s.orders.filter(o => o.phone === phone && !o.demoQueue && this.now() - o.createdAt < 600000).length;
    if (recent >= 6) throw new ApiError(429, 'Too many orders from this number in 10 minutes. Call the store if you need help.');
    // Atomic stock reservation: check everything first, then reserve
    const needQ = {}; q.lines.forEach(l => needQ[l.productId] = (needQ[l.productId] || 0) + l.qty);
    for (const [pid, n] of Object.entries(needQ)) { const left = this.stockLeft(pid); if (left !== null && left < n) throw new ApiError(409, `${this.product(pid).name} just sold out. Review your cart.`); }

    const now = this.now();
    const z = q.zone;
    const o = {
      id: 'o' + rid(7), code: 'HW-' + String(s.seq++).padStart(3, '0') + rid(2).toUpperCase(), token: rid(18), pin: String(1000 + Math.floor(Math.random() * 9000)),
      customerName: name.slice(0, 60), phone, type: req.orderType,
      address: req.orderType === 'delivery' ? {barangay: z.id, barangayLabel: z.label, text: String(req.address.text).slice(0, 160), landmark: String(req.address.landmark || '').slice(0, 120), instructions: String(req.address.instructions || '').slice(0, 200), pin: {...req.address.pin}, contactPref: req.address.contactPref || 'call'} : null,
      pickupTime: req.orderType === 'pickup' ? (req.pickupTime || 'ASAP') : null, scheduledFor: q.preorder ? q.schedAt : null,
      status: 'PLACED', items: q.lines.map(l => ({productId: l.productId, name: l.name, options: l.options, qty: l.qty, unitC: l.unitC, lineC: l.lineC, notes: l.notes})),
      subtotalC: q.subtotalC, deliveryFeeC: q.deliveryFeeC, serviceFeeC: q.serviceFeeC, discountC: q.discountC, totalC: q.totalC, routeKm: q.routeKm,
      ts: {PLACED: now}, createdAt: now, updatedAt: now,
      prepEta: {startAt: now + q.prep.lo * 60000, endAt: now + q.prep.hi * 60000, source: 'estimate', updatedAt: now, rule: q.prep.rule},
      deliveryEta: null, notices: [], idemKey: req.idemKey || null, demoQueue: !!req.demoQueue,
    };
    s.orders.push(o); if (req.idemKey) s.idem[req.idemKey] = o.id;
    s.payments.push({id: 'pay' + rid(6), orderId: o.id, method: req.paymentMethod, status: 'UNPAID', amountC: q.totalC, reference: null, proof: null, rejectReason: null, history: [{status: 'UNPAID', at: now, by: 'System'}], verifiedBy: null, verifiedAt: null, collectedAt: null});
    this.event(o, null, 'PLACED', actor, '');
    this.recalc(o);
    this.audit(actor, 'order', o.code, 'placed', {totalC: o.totalC, method: req.paymentMethod});
    this.emit('order.new', o.id);
    return {code: o.code, token: o.token};
  }

  event(o, prev, next, actor, reason) { this.s.events.push({id: rid(6), orderId: o.id, prev, next, actor: this.who(actor), reason: reason || '', at: this.now()}); }

  /* ---- customer (secure token) ---- */

    if (this.s.payments.some(p => p.id !== pay.id && p.reference === r)) throw new ApiError(409, 'That reference number was already used on another order.');
    pay.reference = r; pay.proof = proof || null; pay.status = 'AWAITING_VERIFICATION'; pay.rejectReason = null;

  customerCancel(code, token) {

  leaveFeedback(code, token, score, text) {
    const o = this.authOrder(code, token);
    if (!['DELIVERED', 'COMPLETED'].includes(o.status)) throw new ApiError(409, 'You can rate the order once it is complete.');
    if (this.s.feedback.some(f => f.orderId === o.id)) throw new ApiError(409, 'You already sent feedback for this order.');
    this.s.feedback.push({orderId: o.id, code: o.code, score, text: String(text || '').slice(0, 300), at: this.now()});

  }

  /* ---- order state machine ---- */
  setStatus(o, to, actor, reason = '') {
    if (!FLOW[o.status].includes(to)) throw new ApiError(409, `An order can't go from “${OS[o.status]}” to “${OS[to]}”.`);
    const prev = o.status, now = this.now(), pay = this.payment(o.id);
    o.status = to; o.ts[to] = now; o.updatedAt = now;
    if (['REJECTED', 'CANCELLED'].includes(to)) {
      this.releaseStock(o);
      if (pay.status === 'PAID') this.payStatus(pay, 'REFUND_PENDING', actor, 'Order ' + OS[to].toLowerCase());
      const d = this.deliveryFor(o.id); if (d && D_ACTIVE.includes(d.status)) { d.status = 'CANCELLED'; d.sharing = 'off'; d.endedAt = now; }
    }
    if (['DELIVERED', 'COMPLETED', 'DELIVERY_FAILED'].includes(to)) this.consumeStock(o);
    if (to === 'READY') o.prepEta = {...o.prepEta, doneAt: now};
    this.event(o, prev, to, actor, reason);
    this.audit(actor, 'order', o.code, `status ${prev} → ${to}`, reason ? {reason} : {});
    this.recalc(o);
    this.emit('order.status', o.id);
  }
  releaseStock(o) { for (const it of o.items) { const inv = this.s.inventory[it.productId]; if (inv) inv.reserved = Math.max(0, inv.reserved - it.qty); } }
  consumeStock(o) { for (const it of o.items) { const inv = this.s.inventory[it.productId]; if (inv) { inv.reserved = Math.max(0, inv.reserved - it.qty); inv.onHand = Math.max(0, inv.onHand - it.qty); } } }
  payStatus(pay, status, actor, note) { pay.status = status; pay.history.push({status, at: this.now(), by: this.who(actor), note: note || ''}); }

  staffTransition(actor, orderId, to, reason = '', opts = {}) {
    need(actor, STAFF, 'update orders');
    const o = this.order(orderId); if (!o) throw new ApiError(404, 'Order not found.');
    const pay = this.payment(o.id);
    if (to === 'ACCEPTED') {
      if (pay.method === 'GCASH' && pay.status !== 'PAID') throw new ApiError(409, 'Verify the GCash payment before accepting this order.');
      o.prepEta = this.rulesEta(o);
    }
    if (to === 'REJECTED' && !reason) throw new ApiError(422, 'Give a reason for rejecting.');
    if (to === 'CANCELLED') { need(actor, MGR, 'cancel accepted orders'); if (!reason) throw new ApiError(422, 'Give a reason for cancelling.'); }
    if (to === 'OUT_FOR_DELIVERY' || to === 'DELIVERED' || to === 'DELIVERY_FAILED') throw new ApiError(409, 'Use Hand to rider. Riders update the delivery from there.');
    if (to === 'COMPLETED') {
      if (o.type !== 'pickup') throw new ApiError(409, 'Only pickup orders are completed at the counter.');
      if (pay.method === 'CASH_PICKUP') { if (!opts.cashReceived) throw new ApiError(422, `Confirm you received ${peso(pay.amountC)} cash.`); this.payStatus(pay, 'PAID', actor, 'Cash received at counter'); pay.collectedAt = this.now(); }

  }
  rulesEta(o) { const p = this.prepEstimate(o.items, o.id), now = this.now(); return {startAt: now + p.lo * 60000, endAt: now + p.hi * 60000, source: 'rules', updatedAt: now, rule: p.rule}; }
  adjustPrep(actor, orderId, minutes) {
    need(actor, STAFF, 'adjust prep time');
    const o = this.order(orderId), m = Math.round(Number(minutes));
    if (!['PLACED', 'ACCEPTED', 'PREPARING'].includes(o.status)) throw new ApiError(409, 'Prep time can only change before the order is ready.');
    if (!(m >= 1 && m <= 180)) throw new ApiError(422, 'Enter 1 to 180 minutes.');

    o.prepEta = {startAt: now + m * 60000, endAt: now + (m + 5) * 60000, source: 'manual', updatedAt: now, rule: `set by ${this.who(actor)}`};
    if (prevEnd && Math.abs(o.prepEta.endAt - prevEnd) > 5 * 60000) o.notices.push({at: now, msg: `The kitchen updated your prep time to about ${m}–${m + 5} min.`});
    this.audit(actor, 'order', o.code, 'prep ETA override', {minutes: m});
    this.recalc(o); this.emit('order.eta', o.id);
  }
  markCash(actor, orderId) {

    if (pay.method !== 'COD') throw new ApiError(409, 'Not a cash-on-delivery order.');
    if (o.status !== 'DELIVERED') throw new ApiError(409, 'Record cash only after the order is delivered and the rider hands it over.');

  }
  verifyPayment(actor, orderId, approve, note) {

    this.audit(actor, 'product', this.product(pid).name, 'option availability', {option: c.label, available: !!available}); this.emit('menu', pid);

    if (p) { const before = {name: p.name, priceC: p.priceC}; Object.assign(p, data); this.audit(actor, 'product', p.name, 'edited', {before, after: {name, priceC}}); }
    else { const np = {id: 'p-' + rid(5), art: 'plate', active: true, availability: 'AVAILABLE', groups: [], ...data}; this.s.products.push(np); this.audit(actor, 'product', np.name, 'created', {priceC}); }

  imgOk(d) { return typeof d === 'string' && /^data:image\/(png|jpeg|webp);base64,[A-Za-z0-9+/=]+$/.test(d) && d.length < 900000; }
  cleanPic(v) {

    return {photo: v.photo, src: v.src, edit: {zoom: num(e.zoom, 1, 4, 1), dx: num(e.dx, -60, 60, 0), dy: num(e.dy, -60, 60, 0), rot: [0, 90, 180, 270].includes(e.rot) ? e.rot : 0, fit: e.fit === 'contain' ? 'contain' : 'cover', bg: e.bg === 'dark' ? 'dark' : 'white'}};
  }
  setBrand(actor, patch) {

    const st = this.s.store, v = patch.logo;

  }
  setPhoto(actor, pid, v) {
    need(actor, ['admin'], 'change product photos');

/* =========================================================
   Simulator — demo GPS for riders (clearly labeled)
   ========================================================= */
function simTick() {
  let changed = false;
  for (const d of S.deliveries) {
    if (!D_ONJOB.includes(d.status) || d.sharing !== 'on' || d.gpsPaused) continue;
    const o = api.order(d.orderId), path = routePath(S.storePos, o.address.pin), L = pathLen(path);
    let pos;
    if (d.status === 'ACCEPTED') pos = {x: S.storePos.x - 30 + Math.min(28, (Date.now() - d.ts.ACCEPTED) / 1000 * 2), y: S.storePos.y - 18};
    else if (d.status === 'AT_STORE' || d.status === 'COLLECTED') pos = {x: S.storePos.x + 4, y: S.storePos.y - 6};
    else if (d.status === 'EN_ROUTE') { d.progress = Math.min(L, (d.progress || 0) + 13); pos = pointAt(path, d.progress); }
    else pos = {...o.address.pin};
    const jitter = () => (Math.random() - .5) * 1.6;
    try { api.postLocation({role: 'rider', id: d.riderId}, d.id, {x: pos.x + jitter(), y: pos.y + jitter(), acc: 8 + Math.round(Math.random() * 10)}); changed = true; } catch (e) {}
  }
  if (api.purgeLocations()) changed = true;
  if (changed) save();
  scheduleRender(); // refresh "x seconds ago" labels
}

    case 'meal': g = `<ellipse cx="80" cy="60" rx="58" ry="26" class="f4"/><ellipse cx="62" cy="56" rx="24" ry="14" fill="#fff8ec"/>` + wing(98, 54, 12, .75) + wing(108, 68, -14, .7); break;
    case 'bowl': g = `<path d="M30 48 h100 a50 34 0 0 1 -100 0z" class="f3"/><ellipse cx="80" cy="48" rx="50" ry="12" fill="#fff8ec"/><rect x="58" y="34" width="20" height="10" rx="4" class="f1"/><rect x="80" y="36" width="22" height="9" rx="4" class="f2"/>`; break;
    case 'fries': g = `<path d="M54 44 h52 l-6 44 h-40z" class="f1"/>` + [60, 68, 76, 84, 92, 100].map((x, i) => `<rect x="${x - 3}" y="${18 + (i % 3) * 5}" width="6" height="34" rx="2" class="f2"/>`).join('') + `<path d="M54 44 h52 l-6 44 h-40z" class="f1"/>`; break;
    case 'sticks': g = [0, 1, 2, 3].map(i => `<rect x="${38 + i * 6}" y="${30 + i * 10}" width="70" height="13" rx="6.5" class="f2" transform="rotate(-10 80 50)"/>`).join('') + `<ellipse cx="128" cy="68" rx="14" ry="9" class="f3"/>`; break;
    case 'slaw': g = `<path d="M44 50 h72 a36 26 0 0 1 -72 0z" class="f4"/><ellipse cx="80" cy="50" rx="36" ry="9" fill="#eef4dc"/>`; break;
    case 'rice': g = `<path d="M50 50 h60 a30 24 0 0 1 -60 0z" class="f3"/><ellipse cx="80" cy="46" rx="28" ry="12" class="f2"/>`; break;
    case 'pasta': g = `<ellipse cx="80" cy="58" rx="56" ry="24" class="f4"/>` + [0, 1, 2, 3, 4].map(i => `<path d="M${46 + i * 6} ${50 + (i % 2) * 6} q12 -14 24 0 t24 0" fill="none" stroke-width="4" class="f2" style="stroke:var(--food-2)"/>`).join('') + `<circle cx="96" cy="50" r="7" class="f1"/>`; break;
    case 'burger': g = `<path d="M50 50 a30 22 0 0 1 60 0z" class="f2"/><rect x="48" y="52" width="64" height="9" rx="4" class="f3"/><rect x="50" y="62" width="60" height="5" rx="2" fill="#7fb24a"/><rect x="50" y="68" width="60" height="10" rx="5" class="f2"/>`; break;
    case 'nachos': g = [0, 1, 2, 3, 4, 5].map(i => `<path d="M${44 + i * 12} 74 l10 -30 l10 30z" class="${i % 2 ? 'f2' : 'f1'}"/>`).join('') + `<ellipse cx="80" cy="56" rx="22" ry="6" fill="#f3c74a" opacity=".85"/>`; break;
    case 'bilao': g = `<ellipse cx="80" cy="56" rx="66" ry="32" class="f3"/><ellipse cx="80" cy="54" rx="58" ry="27" fill="#7fb24a" opacity=".7"/>` + wing(56, 50, -10, .6) + wing(96, 44, 14, .6) + `<rect x="74" y="60" width="34" height="8" rx="4" class="f2"/>`; break;
    case 'tray': g = `<rect x="26" y="30" width="108" height="50" rx="6" class="f4"/><rect x="34" y="36" width="44" height="38" rx="4" class="f1"/><rect x="82" y="36" width="44" height="38" rx="4" class="f2"/>`; break;
    case 'sizzle': g = `<ellipse cx="80" cy="60" rx="58" ry="24" class="f3"/><ellipse cx="80" cy="56" rx="48" ry="18" class="f1"/>` + [0, 1, 2, 3].map(i => `<rect x="${58 + i * 12}" y="${48 + (i % 2) * 6}" width="9" height="6" rx="2" class="f2"/>`).join(''); break;
    case 'tea': case 'cooler': case 'water': {

const WORDMARK_TEXT = `<span class="wm" aria-hidden="true"><span>HOT</span><span>WINGS</span></span>`;

/* =========================================================
   Map (schematic SVG — no real streets)
   ========================================================= */
function mapSvg(o = {}) {
  const sp = S.storePos;
  let g = `<rect width="400" height="300" class="m-bg"/>`;
  for (let x = 20; x < 400; x += 40) g += `<line x1="${x}" y1="0" x2="${x}" y2="300" class="m-road2" stroke-width="2"/>`;
  for (let y = 30; y < 300; y += 40) g += `<line x1="0" y1="${y}" x2="400" y2="${y}" class="m-road2" stroke-width="2"/>`;
  g += `<line x1="0" y1="${sp.y}" x2="400" y2="${sp.y}" class="m-road" stroke-width="9"/><line x1="${sp.x}" y1="0" x2="${sp.x}" y2="300" class="m-road" stroke-width="6"/><line x1="0" y1="250" x2="400" y2="40" class="m-road" stroke-width="5"/>`;
  g += `<text x="8" y="${sp.y - 7}" class="m-lbl">Main road (schematic)</text>`;
  if (o.zone !== false) g += `<circle cx="${sp.x}" cy="${sp.y}" r="${S.serviceRadius}" class="m-zone"/>`;
  if (o.labels !== false) for (const z of S.zones) g += `<text x="${z.c.x}" y="${z.c.y}" text-anchor="middle" class="m-lbl" opacity="${z.enabled ? 1 : .6}">${esc(z.label)}${z.enabled ? '' : ' (no delivery)'}</text>`;
  if (o.dest) {
    const path = routePath(sp, o.dest);
    if (o.route !== false) g += `<polyline points="${path.map(p => p.x + ',' + p.y).join(' ')}" class="m-route"/>`;
    g += `<g transform="translate(${o.dest.x} ${o.dest.y})"><path d="M0 0 C-9 -12 -10 -16 -10 -21 a10 10 0 0 1 20 0 c0 5 -1 9 -10 21z" class="m-dest"/><circle cx="0" cy="-21" r="3.6" fill="var(--surface)"/></g>`;
  }
  g += `<g transform="translate(${sp.x} ${sp.y})"><rect x="-14" y="-14" width="28" height="28" rx="7" class="m-store"/><text x="0" y="3.5" text-anchor="middle" class="m-store-t">HW</text></g>`;
  for (const r of (o.others || [])) g += `<g transform="translate(${r.x} ${r.y})"><circle r="7" class="${r.stale ? 'm-rider-stale' : 'm-other'}"/><text x="10" y="4" class="m-rlbl">${esc(r.label)}</text></g>`;
  if (o.rider) {
    const r = o.rider;
    g += `<g class="rider-g" style="transform:translate(${r.x}px,${r.y}px)">${r.stale ? '' : `<circle r="${Math.max(6, r.acc / 2.5)}" class="m-acc"/>`}<circle r="8" class="${r.stale ? 'm-rider-stale' : 'm-rider'}"/>${r.stale ? '' : '<circle r="2.6" fill="var(--surface)"/>'}<text x="11" y="-9" class="m-rlbl">${r.stale ? 'Last known' : 'Rider'}</text></g>`;
  }
  return `<div class="mapbox${o.picking ? ' picking' : ''}"><span class="maptag">${o.tag || 'DEMO MAP · SCHEMATIC, NOT REAL STREETS'}</span><svg viewBox="0 0 400 300" ${o.picking ? 'data-act="pickpin" id="pinmap"' : ''} role="img" aria-label="${esc(o.aria || 'Schematic delivery map')}">${g}</svg></div>`;
}

function render(force = true) {

  const typing = !force && ae && ae.matches && ae.matches('input[type=text],input[type=tel],input[type=search],input[type=number],input[type=range],textarea,select') && !ae.closest('#top');

document.addEventListener('focusout', () => setTimeout(() => { if ((pendingApp || pendingOverlay) && !(document.activeElement && document.activeElement.matches && document.activeElement.matches('input,textarea,select'))) render(); }, 0));

function timelineSteps(t) {
  const del = t.type === 'delivery', ts = t.ts, gc = t.payment.method === 'GCASH';
  const paidAt = gc && t.payment.status === 'PAID' ? true : false;
  const steps = [{k: 'PLACED', label: 'Order placed', at: ts.PLACED}];
  if (gc) steps.push({k: 'PAY', label: t.payment.status === 'PAID' ? 'Payment confirmed' : 'Waiting for payment confirmation', done: paidAt});
  steps.push({k: 'ACCEPTED', label: 'Accepted by the store', at: ts.ACCEPTED}, {k: 'PREPARING', label: 'Preparing your food', at: ts.PREPARING}, {k: 'READY', label: del ? 'Ready, waiting for rider' : 'Ready for pickup', at: ts.READY});
  if (del) steps.push({k: 'RIDER', label: t.rider ? `Rider assigned · ${t.rider.name}` : 'Rider assigned', done: !!t.rider}, {k: 'OUT_FOR_DELIVERY', label: 'Picked up, on the way', at: ts.OUT_FOR_DELIVERY}, {k: 'DELIVERED', label: 'Delivered', at: ts.DELIVERED});
  else steps.push({k: 'COMPLETED', label: 'Picked up', at: ts.COMPLETED});
  steps.forEach(s => { if (s.done === undefined) s.done = !!s.at; });
  const firstOpen = steps.findIndex(s => !s.done);
  return steps.map((s, i) => ({...s, now: i === firstOpen && !TERMINAL.includes(t.status)}));
}

/* ---------- Product modal ---------- */
function productModal(m) {
  const p = api.getMenu().products.find(x => x.id === m.id); if (!p) return '';
  const sold = p.av === 'SOLD_OUT', sel = m.sel;
  let unit = p.priceC; p.groups.forEach(g => (sel[g.id] || []).forEach(cid => { const c = g.choices.find(c => c.id === cid); if (c) unit += c.deltaC; }));
  const missing = p.groups.filter(g => g.required && !(sel[g.id] || []).length);
  const maxQ = Math.min(p.maxQty, p.left ?? 99);
  return `<div class="scrim" data-act="closemodal" data-self="1"><div class="sheet" role="dialog" aria-modal="true" aria-labelledby="pm-t">
  <div class="sheet-h"><h2 id="pm-t">${esc(p.name)}</h2><button type="button" class="xbtn" data-act="closemodal" aria-label="Close">×</button></div>
  <div class="sheet-b">${pic(p)}<div class="stack" style="gap:6px"><p>${esc(p.desc)}</p><div class="row"><b class="num">${peso(p.priceC)}</b>${pill(AV_TONE[p.av], p.av === 'LOW_STOCK' && p.left != null ? p.left + ' left' : AV[p.av])}<span class="xs muted">Approx. ${p.prepMin} min prep</span></div>${p.preorder ? `<div class="notice n-info"><div><b>Pre-order only.</b> ${p.minQty ? `Minimum ${p.minQty} packs. ` : ''}You'll pick a date at least 24 hours ahead at checkout.</div></div>` : ''}${p.allergens ? `<p class="xs muted"><b>Allergens:</b> ${esc(p.allergens)}</p>` : ''}</div>
  ${sold ? `<div class="notice n-bad"><div><b>Sold out.</b> You can't add this item right now.</div></div>` : ''}
  ${p.groups.map(g => `<fieldset class="stack" style="border:0;padding:0;margin:0;gap:8px"><legend class="row" style="margin-bottom:8px"><b>${esc(g.label)}</b><span class="xs muted">${g.required ? 'Required' : 'Optional'}${g.type === 'multi' && g.max ? ` · pick up to ${g.max}` : ''}</span></legend>
    ${g.choices.map(c => `<label class="choice${c.available ? '' : ' off'}"><input type="${g.type === 'single' ? 'radio' : 'checkbox'}" name="g-${g.id}" id="opt-${g.id}-${c.id}" data-act-change="opt" data-g="${g.id}" data-c="${c.id}" ${(sel[g.id] || []).includes(c.id) ? 'checked' : ''} ${c.available && !sold ? '' : 'disabled'}><span class="grow">${esc(c.label)}${c.available ? '' : ' · unavailable'}</span><span class="num small">${c.deltaC ? '+' + peso(c.deltaC) : ''}</span></label>`).join('')}</fieldset>`).join('')}
  <div class="field"><label for="pm-notes">Notes for the kitchen (optional)</label><input type="text" id="pm-notes" maxlength="140" value="${esc(m.notes)}" data-bind="modal.notes" placeholder="Extra crispy, sauce on the side…"></div>
  </div>
  <div class="sheet-f row"><div class="qty"><button type="button" data-act="mqty" data-d="-1" ${m.qty <= (p.minQty || 1) ? 'disabled' : ''} aria-label="Decrease">−</button><span class="num">${m.qty}</span><button type="button" data-act="mqty" data-d="1" ${m.qty >= maxQ ? 'disabled' : ''} aria-label="Increase">+</button></div>
  <button type="button" class="btn btn-primary grow" data-act="addcart" ${sold || missing.length || ui.offline ? 'disabled' : ''}>${sold ? 'Sold out' : missing.length ? 'Choose ' + esc(missing[0].label.toLowerCase()) : `${m.editIdx != null ? 'Update' : 'Add'} · ${peso(unit * m.qty)}`}</button></div></div></div>`;
}

/* ---------- Staff: orders ---------- */
function orderAgeMin(o) { return Math.floor((Date.now() - o.createdAt) / 60000); }
function isUrgent(o) { return (o.status === 'PLACED' && Date.now() - o.createdAt > 3 * 60000) || (['ACCEPTED', 'PREPARING'].includes(o.status) && o.prepEta && Date.now() > o.prepEta.endAt); }
function sOrders() {
  const q = ui.staffSearch.trim().toLowerCase();
  let os = S.orders.slice().sort((a, b) => a.createdAt - b.createdAt);
  if (q) os = os.filter(o => (o.code + ' ' + o.customerName + ' ' + o.phone).toLowerCase().includes(q));
  if (ui.staffFilter === 'delivery' || ui.staffFilter === 'pickup') os = os.filter(o => o.type === ui.staffFilter);
  if (ui.staffFilter === 'today') os = os.filter(o => Date.now() - o.createdAt < 86400000);
  const cols = [['new', 'New', ['PLACED']], ['kitchen', 'Kitchen', ['ACCEPTED', 'PREPARING']], ['ready', 'Ready', ['READY']], ['out', 'Out for delivery', ['OUT_FOR_DELIVERY']], ['done', 'Closed', TERMINAL]];
  const st = api.storeStatus();
  return `<div class="swrap gutter stack-lg">
  <div class="row between"><div class="stack" style="gap:2px"><h1 class="display" style="font-size:30px">Orders</h1><span class="small muted">Oldest first · ${st.kitchenLoad} in the kitchen · ${S.store.staffOnDuty} staff on duty</span></div>
  <div class="row"><label class="switch small"><input type="checkbox" id="snd" data-act-change="sound" ${ui.sound ? 'checked' : ''}> Sound alert for new orders</label>${MGR.includes(ui.role) ? `<button type="button" class="btn btn-sm ${S.store.paused ? 'btn-primary' : ''}" data-act="pause">${S.store.paused ? 'Resume ordering' : 'Pause new orders'}</button>` : ''}</div></div>
  ${S.store.paused ? `<div class="notice n-warn"><div><b>New orders are paused.</b> Customers can still track existing orders.</div></div>` : ''}
  <div class="row"><div class="field grow" style="min-width:200px"><label for="ssearch" class="sr">Search orders</label><input type="search" id="ssearch" data-bind="staffSearch" value="${esc(ui.staffSearch)}" placeholder="Order number, customer name or phone"></div>
  <div class="field" style="width:auto"><label for="sfilter">Show</label><select id="sfilter" data-bind="staffFilter" data-rerender="1">${[['all', 'All orders'], ['today', 'Last 24 hours'], ['delivery', 'Delivery only'], ['pickup', 'Pickup only']].map(([v, l]) => `<option value="${v}" ${ui.staffFilter === v ? 'selected' : ''}>${l}</option>`).join('')}</select></div></div>
  <div class="kanban">${cols.map(([id, label, sts]) => { const list = os.filter(o => sts.includes(o.status)); const shown = id === 'done' ? list.slice(-12).reverse() : list; return `<section class="kcol" id="col-${id}" aria-label="${label}"><h3><span>${label}</span><span class="num">${list.length}</span></h3>${shown.map(oCard).join('') || '<div class="xs muted" style="padding:10px 4px">Nothing here</div>'}</section>`; }).join('')}</div>
  ${!S.orders.length ? `<div class="notice n-info"><div>No orders yet. Place one as the <b>Customer</b>, or open <b>Demo guide</b> to run a scenario.</div></div>` : ''}</div>`;
}
function oCard(o) {
  const pay = api.payment(o.id), d = o.type === 'delivery' ? api.deliveryFor(o.id) : null, urgent = isUrgent(o);
  const prep = ['ACCEPTED', 'PREPARING'].includes(o.status) && o.prepEta ? `<span class="xs ${Date.now() > o.prepEta.endAt ? '' : 'muted'}" style="${Date.now() > o.prepEta.endAt ? 'color:var(--bad);font-weight:700' : ''}">${Date.now() > o.prepEta.endAt ? 'Past ETA' : 'Due ' + fmtClock(o.prepEta.endAt)}</span>` : '';
  return `<button type="button" class="ocard${urgent ? ' urgent' : ''}" data-act="sorder" data-id="${o.id}"><div class="row between"><span class="code">${o.code}</span><span class="xs muted num">${orderAgeMin(o)} min</span></div>
  <div class="small" style="font-weight:700">${esc(o.customerName)}${o.demoQueue ? ' <span class="demo-chip">DEMO QUEUE</span>' : ''}</div>
  <div class="xs muted">${o.scheduledFor ? '<b>Pre-order ' + fmtDT(o.scheduledFor) + '</b> · ' : ''}${o.type === 'delivery' ? 'Delivery · ' + esc(o.address.barangayLabel) : 'Pickup · ' + esc(o.pickupTime)} · ${o.items.reduce((a, b) => a + b.qty, 0)} items · ${peso(o.totalC)}</div>
  <div class="row" style="gap:6px">${TERMINAL.includes(o.status) ? opill(o.status) : ''}${pay.method === 'GCASH' || pay.status !== 'UNPAID' ? ppill(pay.status) : pill('mute', PM[pay.method])}${d && D_ACTIVE.includes(d.status) ? pill('brand', DS[d.status]) : ''}${prep}${urgent ? pill('bad', 'Urgent') : ''}</div></button>`;
}
function staffOrderModal(m) {

  const ev = S.events.filter(e => e.orderId === o.id);

  const gcBlock = pay.method === 'GCASH' && pay.status !== 'PAID';
  if (o.status === 'PLACED') { acts.push(`<button type="button" class="btn btn-primary" data-act="st" data-to="ACCEPTED" ${gcBlock ? 'disabled' : ''}>Accept</button>`); acts.push(`<button type="button" class="btn btn-danger" data-act="reasonbox" data-kind="REJECTED">Reject…</button>`); }
  if (o.status === 'ACCEPTED') acts.push(`<button type="button" class="btn btn-primary" data-act="st" data-to="PREPARING">Start preparing</button>`);
  if (o.status === 'PREPARING') acts.push(`<button type="button" class="btn btn-primary" data-act="st" data-to="READY">Mark ready</button>`);
  if (o.status === 'READY' && o.type === 'pickup') acts.push(pay.method === 'CASH_PICKUP' ? `<label class="choice"><input type="checkbox" id="cashrcv"> Received ${peso(pay.amountC)} cash</label><button type="button" class="btn btn-primary" data-act="complete">Complete pickup</button>` : `<button type="button" class="btn btn-primary" data-act="complete" ${pay.status === 'PAID' ? '' : 'disabled'}>Complete pickup</button>`);

  if (isMgr && !TERMINAL.includes(o.status) && o.status !== 'OUT_FOR_DELIVERY' && o.status !== 'PLACED') acts.push(`<button type="button" class="btn btn-danger" data-act="reasonbox" data-kind="CANCELLED">Cancel…</button>`);
  if (isMgr && o.status === 'PLACED') acts.push(`<button type="button" class="btn btn-danger btn-ghost" data-act="reasonbox" data-kind="CANCELLED">Cancel…</button>`);
  const canAssign = isMgr && o.type === 'delivery' && ['ACCEPTED', 'PREPARING', 'READY'].includes(o.status) && !(d && D_ACTIVE.includes(d.status));
  const reasons = m.reasonKind === 'REJECTED' ? ['Item unavailable', 'Kitchen at capacity', 'Address outside delivery area', 'Suspected test or spam order', 'Other'] : ['Customer requested', 'Item ran out after acceptance', 'No rider available', 'Payment problem', 'Other'];
  return `<div class="scrim" data-act="closemodal" data-self="1"><div class="sheet wide" role="dialog" aria-modal="true" aria-labelledby="so-t">
  <div class="sheet-h"><h2 id="so-t"><span class="mono">${o.code}</span> · ${esc(o.customerName)}</h2>${opill(o.status)}<button type="button" class="xbtn" data-act="closemodal" aria-label="Close">×</button></div>
  <div class="sheet-b">
  ${gcBlock && o.status === 'PLACED' ? `<div class="notice n-warn"><div><b>GCash ${PS[pay.status].toLowerCase()}.</b> Accept is locked until a manager verifies the payment in Payments.</div></div>` : ''}
  ${acts.length ? `<div class="row">${acts.join('')}</div>` : ''}
  ${m.reasonKind ? `<div class="card stack"><div class="field"><label for="reason">${m.reasonKind === 'REJECTED' ? 'Reason for rejecting' : 'Reason for cancelling'} (shown to the customer)</label><select id="reason">${reasons.map(x => `<option>${x}</option>`).join('')}</select></div><div class="row"><button type="button" class="btn btn-danger" data-act="st" data-to="${m.reasonKind}" data-withreason="1">${m.reasonKind === 'REJECTED' ? 'Reject order' : 'Cancel order'}</button><button type="button" class="btn btn-ghost" data-act="reasonbox" data-kind="">Back</button></div></div>` : ''}
  <div class="sgrid">
   <section class="card stack"><div class="eyebrow">Items</div>${o.items.map(i => `<div class="row between small" style="flex-wrap:nowrap;align-items:flex-start"><div style="min-width:0"><b style="font-size:15px">${i.qty} × ${esc(i.name)}</b><div class="xs muted">${i.options.map(x => esc(x.label)).join(' · ')}</div>${i.notes ? `<div class="xs" style="color:var(--warn);font-weight:700">Note: ${esc(i.notes)}</div>` : ''}</div><span class="num">${peso(i.lineC)}</span></div>`).join('')}
    <div class="sum small"><span>Subtotal</span><span>${peso(o.subtotalC)}</span><span>Fees</span><span>${peso(o.deliveryFeeC + o.serviceFeeC)}</span><span class="tot">Total</span><span class="tot">${peso(o.totalC)}</span></div></section>
   <section class="card stack"><div class="eyebrow">Prep time</div>
    ${o.prepEta && !TERMINAL.includes(o.status) && !['READY', 'OUT_FOR_DELIVERY'].includes(o.status) ? `<div><b>${fmtClock(o.prepEta.startAt)}–${fmtClock(o.prepEta.endAt)}</b> <span class="xs muted">(${o.prepEta.source})</span></div><div class="xs muted">${esc(o.prepEta.rule || '')}</div>
    <div class="row"><div class="field" style="width:120px"><label for="prepmin">Minutes from now</label><input type="number" id="prepmin" min="1" max="180" value="${Math.max(1, minsFromNow(o.prepEta.startAt))}"></div><button type="button" class="btn btn-sm" data-act="prep" style="align-self:flex-end">Update ETA</button></div>` : `<div class="small muted">${o.ts.READY ? 'Ready at ' + fmtClock(o.ts.READY) + (o.ts.ACCEPTED ? ` · took ${Math.round((o.ts.READY - o.ts.ACCEPTED) / 60000)} min` : '') : '—'}</div>`}

    ${o.type === 'delivery' ? `<div class="eyebrow" style="margin-top:6px">Rider</div>${d && D_ACTIVE.includes(d.status) ? `<div class="row">${pill('brand', DS[d.status])}<b class="small">${esc(r.name)}</b></div>` : d ? `<div class="small muted">Last: ${esc(r.name)} · ${DS[d.status]}</div>` : '<div class="small muted">No rider yet</div>'}

  </div>
  <section class="card stack"><div class="eyebrow">Status history</div><ol class="tl">${ev.map(e => `<li class="${['REJECTED', 'CANCELLED', 'DELIVERY_FAILED'].includes(e.next) ? 'ex' : 'done'}"><span class="dot">${['REJECTED', 'CANCELLED', 'DELIVERY_FAILED'].includes(e.next) ? '!' : '✓'}</span><span class="tl-t small">${OS[e.next]} <span class="muted">· ${esc(e.actor)}${e.reason ? ' · ' + esc(e.reason) : ''}</span></span><span class="xs muted num">${fmtClock(e.at)}</span></li>`).join('')}</ol></section>
  </div></div></div>`;
}

  <div class="field"><label for="pe-prep">Prep minutes (baseline)</label><input type="number" id="pe-prep" name="prepMin" value="${p.prepMin}"></div><div class="field"><label for="pe-max">Max per order</label><input type="number" id="pe-max" name="maxQty" value="${p.maxQty}"></div>
  <div class="field"><label for="pe-sku">SKU</label><input type="text" id="pe-sku" name="sku" value="${esc(p.sku)}"></div><div class="field"><label for="pe-all">Allergen note</label><input type="text" id="pe-all" name="allergens" value="${esc(p.allergens)}"></div></div>
  <p class="xs muted">Photos are resized to 480 px and kept in this browser in the prototype. The pilot stores them in Supabase Storage.</p><button class="btn btn-primary" type="submit">${m.id ? 'Save changes' : 'Add item'}</button></form>` : ''}
  ${p.groups.length ? `<section class="stack"><div class="eyebrow">Option availability</div>${p.groups.map(g => `<div class="stack" style="gap:6px"><b class="small">${esc(g.label)}</b>${g.choices.map(c => `<label class="switch small"><input type="checkbox" id="ch-${g.id}-${c.id}" data-act-change="choice" data-id="${m.id}" data-g="${g.id}" data-c="${c.id}" ${c.available ? 'checked' : ''}> ${esc(c.label)}${c.deltaC ? ' (+' + peso(c.deltaC) + ')' : ''}</label>`).join('')}</div>`).join('')}</section>` : m.id ? '<p class="small muted">This item has no options.</p>' : ''}</div></div></div>`;

function stockModal(m) {

  <form class="row" data-form="stock"><div class="field" style="width:160px"><label for="sk-n">Units on hand</label><input type="number" id="sk-n" name="n" min="0" value="${inv ? inv.onHand : 10}"></div><button class="btn btn-primary" type="submit" style="align-self:flex-end">${inv ? 'Save count' : 'Start counting'}</button></form>

function histModal(m) {
