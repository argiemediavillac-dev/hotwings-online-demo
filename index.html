  <div class="sheet-b">${rows.length ? rows.map(a => `<div class="small" style="border-bottom:1px solid var(--line);padding-bottom:8px"><b>${esc(a.action)}</b> ${esc(fmtMeta(a.meta))}<div class="xs muted">${esc(a.actor)} · ${fmtDT(a.at)}</div></div>`).join('') : '<p class="muted small">No changes yet.</p>'}</div></div></div>`;
}
function fmtMeta(m) { return Object.entries(m || {}).map(([k, v]) => k + ': ' + (typeof v === 'object' ? JSON.stringify(v) : (k.endsWith('C') && typeof v === 'number' ? peso(v) : v))).join(' · '); }

/* ---------- Staff: payments ---------- */
function sPay() {
  const rows = S.orders.map(o => [o, api.payment(o.id)]);
  const pending = rows.filter(([, p]) => p.status === 'AWAITING_VERIFICATION');
  const cod = rows.filter(([o, p]) => p.method === 'COD' && p.status === 'UNPAID' && !['REJECTED', 'CANCELLED'].includes(o.status));
  const refunds = rows.filter(([, p]) => p.status === 'REFUND_PENDING');
  const hist = rows.flatMap(([o, p]) => p.history.filter(h => h.status !== 'UNPAID').map(h => ({...h, code: o.code, method: p.method, amountC: p.amountC}))).sort((a, b) => b.at - a.at).slice(0, 30);
  return `<div class="swrap gutter stack-lg"><div><h1 class="display" style="font-size:30px">Payments</h1><p class="small muted">Check each GCash reference against the merchant account's own transaction history before approving. A screenshot alone is not proof.</p></div>
  <section class="stack"><h2 style="font-size:17px;font-weight:800">GCash waiting for verification <span class="badge">${pending.length}</span></h2>
  ${pending.length ? pending.map(([o, p]) => `<div class="card row" style="align-items:flex-start"><div class="grow stack" style="gap:4px"><div class="row"><span class="mono" style="font-weight:700">${o.code}</span>${opill(o.status)}</div><div class="small">${esc(o.customerName)} · <b class="num">${peso(p.amountC)}</b></div><div class="small">Ref <span class="mono" style="font-weight:700">${esc(p.reference)}</span> · sent ${ago(p.history[p.history.length - 1].at)}</div>
   ${ui.modal?.rejectPay === o.id ? `<div class="row"><select id="payreason" style="width:auto;flex:1"><option>Reference not found in GCash history</option><option>Amount doesn't match the order total</option><option>Screenshot is unreadable</option></select><button type="button" class="btn btn-sm btn-danger" data-act="payreject" data-id="${o.id}" data-confirm="1">Send rejection</button></div>` : ''}</div>
   ${p.proof ? `<img src="${p.proof}" class="proof" alt="Customer's receipt screenshot for ${o.code}">` : '<span class="xs muted" style="width:96px">No screenshot</span>'}
   <div class="stack" style="gap:6px"><button type="button" class="btn btn-sm btn-primary" data-act="payok" data-id="${o.id}">Verified in GCash</button><button type="button" class="btn btn-sm btn-danger" data-act="payreject" data-id="${o.id}">Reject…</button></div></div>`).join('') : '<div class="card empty small">No GCash payments waiting.</div>'}</section>
  <div class="sgrid"><section class="stack"><h2 style="font-size:17px;font-weight:800">Cash on delivery</h2><div class="tbl-wrap"><table><thead><tr><th>Order</th><th>Status</th><th class="r">Cash</th><th></th></tr></thead><tbody>${cod.map(([o, p]) => `<tr><td class="mono">${o.code}</td><td>${opill(o.status)}</td><td class="r num">${peso(p.amountC)}</td><td>${o.status === 'DELIVERED' ? `<button type="button" class="btn btn-sm" data-act="cashrow" data-id="${o.id}">Cash received</button>` : '<span class="xs muted">With rider after delivery</span>'}</td></tr>`).join('') || '<tr><td colspan="4" class="muted small">No cash outstanding.</td></tr>'}</tbody></table></div></section>
  <section class="stack"><h2 style="font-size:17px;font-weight:800">Refunds pending</h2><div class="tbl-wrap"><table><tbody>${refunds.map(([o, p]) => `<tr><td class="mono">${o.code}</td><td class="r num">${peso(p.amountC)}</td><td><button type="button" class="btn btn-sm" data-act="refundrow" data-id="${o.id}">Mark sent</button></td></tr>`).join('') || '<tr><td class="muted small">None.</td></tr>'}</tbody></table></div></section></div>
  <section class="stack"><h2 style="font-size:17px;font-weight:800">Verification trail</h2><div class="tbl-wrap"><table><thead><tr><th>Time</th><th>Order</th><th>Status</th><th>By</th><th>Note</th></tr></thead><tbody>${hist.map(h => `<tr><td class="num small">${fmtDT(h.at)}</td><td class="mono">${h.code}</td><td>${ppill(h.status)}</td><td class="small">${esc(h.by)}</td><td class="small">${esc(h.note || '')}</td></tr>`).join('') || '<tr><td colspan="5" class="muted small">No payment activity yet.</td></tr>'}</tbody></table></div></section></div>`;
}

/* ---------- Staff: dispatch ---------- */
function sDispatch() {
  const waiting = S.orders.filter(o => o.type === 'delivery' && ['ACCEPTED', 'PREPARING', 'READY'].includes(o.status) && !(api.deliveryFor(o.id) && D_ACTIVE.includes(api.deliveryFor(o.id).status)));
  const active = S.deliveries.filter(d => D_ACTIVE.includes(d.status));
  const others = active.map(d => { const l = api.latestLoc(d.id); return l && d.sharing === 'on' ? {x: l.x, y: l.y, label: api.rider(d.riderId).name.replace('Demo ', ''), stale: Date.now() - l.recordedAt > 60000} : null; }).filter(Boolean);
  return `<div class="swrap gutter stack-lg"><div><h1 class="display" style="font-size:30px">Dispatch</h1><p class="small muted">One active delivery per rider in this version. Riders see the customer's details only after they accept.</p></div>
  <div class="sgrid"><section class="stack"><h2 style="font-size:17px;font-weight:800">Needs a rider <span class="badge">${waiting.length}</span></h2>
  ${waiting.map(o => { const d = api.deliveryFor(o.id); return `<div class="card stack"><div class="row between"><span class="mono" style="font-weight:700">${o.code}</span>${opill(o.status)}</div><div class="small">${esc(o.address.barangayLabel)} · ${o.routeKm} km · ready ${o.status === 'READY' ? 'now' : 'by ' + fmtClock(o.prepEta.endAt)}</div>${d && d.status === 'DECLINED' ? '<div class="xs" style="color:var(--warn);font-weight:700">Last offer declined</div>' : ''}<div class="row"><select id="as-${o.id}" style="flex:1;width:auto" aria-label="Rider for ${o.code}">${S.riders.map(r => `<option value="${r.id}" ${!r.online || api.riderBusy(r.id) ? 'disabled' : ''}>${esc(r.name)} · ${!r.online ? 'offline' : api.riderBusy(r.id) ? 'busy' : 'available'}</option>`).join('')}</select><button type="button" class="btn btn-sm btn-primary" data-act="assignrow" data-id="${o.id}">Offer job</button></div></div>`; }).join('') || '<div class="card empty small">No delivery orders waiting for a rider.</div>'}
  <h2 style="font-size:17px;font-weight:800">Riders</h2><div class="tbl-wrap"><table><thead><tr><th>Rider</th><th>Status</th><th>Job</th><th>Location</th></tr></thead><tbody>${S.riders.map(r => { const d = active.find(x => x.riderId === r.id), l = d && api.latestLoc(d.id); return `<tr><td><b>${esc(r.name)}</b><div class="xs muted">${esc(r.vehicle)}</div></td><td>${pill(r.online ? 'ok' : 'mute', r.online ? 'Online' : 'Offline')}</td><td>${d ? `<span class="mono small">${api.order(d.orderId).code}</span> ${pill('brand', DS[d.status])}` : '<span class="xs muted">—</span>'}</td><td class="small">${!d ? '—' : d.sharing === 'denied' ? 'Permission denied' : d.sharing !== 'on' ? 'Not sharing' : l ? (Date.now() - l.recordedAt > 60000 ? `<span style="color:var(--bad);font-weight:700">Stale · ${ago(l.recordedAt)}</span>` : 'Live · ' + ago(l.recordedAt)) : 'Waiting for first fix'}</td></tr>`; }).join('')}</tbody></table></div></section>
  <section class="stack"><h2 style="font-size:17px;font-weight:800">Rider map</h2>${mapSvg({others, labels: true, tag: 'DEMO MAP · SIMULATED RIDERS'})}<p class="xs muted">Only staff with dispatch rights see all riders. Customers see only their own rider, only during their delivery.</p></section></div></div>`;
}

/* ---------- Staff: reports ---------- */
function sReports() {
  const r = api.report(actor());
  const k = (label, v, note) => `<div class="kpi"><div class="eyebrow">${label}</div><div class="v">${v}</div>${note ? `<div class="xs muted">${note}</div>` : ''}</div>`;
  const fmtMin = v => v == null ? '—' : v + ' min';
  return `<div class="swrap gutter stack-lg"><div><h1 class="display" style="font-size:30px">Reports</h1><p class="small muted">All demo orders in this browser, excluding simulated queue orders. Sales are what customers owe; collections are money actually received.</p></div>
  <div class="eyebrow">Sales</div><div class="kpis">${k('Orders', r.count)}${k('Gross item sales', peso(r.grossC))}${k('Delivery & service fees', peso(r.feesC))}${k('Discounts', peso(r.discountC))}${k('Total sales', peso(r.salesC), 'Excludes rejected and cancelled')}</div>
  <div class="eyebrow">Collections</div><div class="kpis">${k('Collected', peso(r.collectedC), 'Payments marked paid')}${k('COD cash outstanding', peso(r.codOutstandingC), 'Delivered, cash not yet handed in')}${k('COD in transit', peso(r.codInTransitC), 'Open COD orders')}${k('GCash awaiting check', peso(r.gcashPendingC))}${k('Refunds pending', peso(r.refundPendingC))}</div>
  <div class="eyebrow">Operations</div><div class="kpis">${k('Avg prep', fmtMin(r.avgPrep), 'Accepted → ready')}${k('Avg dispatch wait', fmtMin(r.avgDispatch), 'Ready → picked up')}${k('Avg delivery', fmtMin(r.avgDelivery), 'Picked up → delivered')}${k('Rejected / cancelled', r.cancelled)}${k('Failed deliveries', r.failed)}${k('Sold-out events', r.soldOutEvents)}</div>
  <div class="row">${r.byStatus.map(([s, n]) => `${opill(s)}<span class="num small" style="margin-right:8px">${n}</span>`).join('')}</div>
  <section class="stack"><div class="row between"><h2 style="font-size:17px;font-weight:800">Export orders (CSV)</h2><button type="button" class="btn btn-sm" data-act="copycsv">Copy CSV</button></div><textarea class="csv" id="csvbox" readonly aria-label="Orders CSV">${esc(api.csv(actor()))}</textarea><p class="xs muted">Copy and paste into a spreadsheet. File download is disabled inside this preview.</p></section></div>`;
}

/* ---------- Staff: settings ---------- */
function sSettings() {
  const st = S.store;
  return `<div class="swrap gutter stack-lg"><div><h1 class="display" style="font-size:30px">Store settings</h1><p class="small muted">Demo values. Replace with the store's confirmed hours, zones and fees before the pilot.</p></div>
  <div class="sgrid"><section class="card stack"><h2 style="font-size:17px;font-weight:800">Ordering</h2>
   <label class="switch"><input type="checkbox" id="s-paused" data-act-change="store" data-k="paused" ${st.paused ? 'checked' : ''}> Pause all new orders</label>

   <label class="switch"><input type="checkbox" id="s-pick" data-act-change="store" data-k="acceptsPickup" ${st.acceptsPickup ? 'checked' : ''}> Accept pickup orders</label>

   <div class="field"><label for="s-staff">Kitchen staff on duty</label><input type="number" id="s-staff" name="staffOnDuty" value="${st.staffOnDuty}"></div><div class="field"><label for="s-cap">Max orders in kitchen</label><input type="number" id="s-cap" name="maxActive" value="${st.maxActive}"></div></div><button class="btn btn-sm" type="submit">Save hours & capacity</button></form>
   <p class="xs muted">Prep estimate rule: largest item baseline + quantity allowance + 6 min per order ahead ÷ staff on duty. Range shown is that value to +10 min.</p></section>
  <section class="card stack"><h2 style="font-size:17px;font-weight:800">Delivery zones (by barangay)</h2><div class="tbl-wrap"><table><thead><tr><th>Barangay</th><th>Fee ₱</th><th>Min ₱</th><th>On</th></tr></thead><tbody>${S.zones.map(z => `<tr><td>${esc(z.label)}</td><td><input type="number" id="zf-${z.id}" style="width:86px;min-height:38px" value="${z.feeC / 100}" data-act-change="zone" data-id="${z.id}" data-k="feeC" aria-label="Fee for ${esc(z.label)}"></td><td><input type="number" id="zm-${z.id}" style="width:96px;min-height:38px" value="${z.minC / 100}" data-act-change="zone" data-id="${z.id}" data-k="minC" aria-label="Minimum for ${esc(z.label)}"></td><td><input type="checkbox" id="ze-${z.id}" data-act-change="zone" data-id="${z.id}" data-k="enabled" ${z.enabled ? 'checked' : ''} aria-label="Deliver to ${esc(z.label)}" style="width:20px;height:20px"></td></tr>`).join('')}</tbody></table></div><p class="xs muted">Pins must also fall inside the service circle on the map (${(S.serviceRadius * UNIT_KM).toFixed(1)} km demo radius).</p></section>
  <section class="card stack"><h2 style="font-size:17px;font-weight:800">Logo</h2><div class="row">${S.store.logo ? brandMark(72) : `<span style="font-size:1.6em">${WORDMARK_TEXT}</span>`}<div class="stack grow" style="gap:6px"><p class="small muted">${S.store.logo ? 'Your uploaded logo shows in the customer header, store and rider apps.' : 'No logo uploaded. The text wordmark is used.'}</p>${ui.role === 'admin' ? `<div class="row"><label class="btn btn-sm" style="cursor:pointer">${S.store.logo ? 'Replace logo' : 'Upload logo'}<input type="file" accept="image/*" hidden id="logo-up" data-act-change="logo"></label>${S.store.logo ? '<button type="button" class="btn btn-sm" data-act="edopen" data-t="logo">Edit</button><button type="button" class="btn btn-sm btn-ghost btn-danger" data-act="rmlogo">Delete</button>' : ''}${S.store.logo !== LOGO_ORIGINAL ? '<button type="button" class="btn btn-sm btn-ghost" data-act="logorestore">Restore original</button>' : ''}</div>` : '<p class="xs muted">Only Admin can change the logo.</p>'}<p class="xs muted">Edit, crop and rotate in the photo editor. All photos are also in the Photos tab.</p></div></div></section>
  <section class="card stack"><h2 style="font-size:17px;font-weight:800">Demo switches</h2>
   <label class="switch"><input type="checkbox" id="s-route" data-act-change="store" data-k="routeOutage" ${S.demo.routeOutage ? 'checked' : ''}> Simulate route service outage</label>
   <label class="switch"><input type="checkbox" id="s-off" data-act-change="offline" ${ui.offline ? 'checked' : ''}> Simulate customer offline</label>
   <button type="button" class="btn btn-danger" data-act="reset">Reset all demo data</button></section></div></div>`;

function sAudit() {
  return `<div class="swrap gutter stack-lg"><div><h1 class="display" style="font-size:30px">Audit log</h1><p class="small muted">Every consequential change, newest first. Last 500 entries in this demo.</p></div>
  <div class="tbl-wrap"><table><thead><tr><th>Time</th><th>Who</th><th>What</th><th>Action</th><th>Details</th></tr></thead><tbody>${S.audit.slice(0, 200).map(a => `<tr><td class="num small" style="white-space:nowrap">${fmtDT(a.at)}</td><td class="small">${esc(a.actor)}</td><td class="small">${esc(a.entity)} · <span class="mono">${esc(a.entityId)}</span></td><td class="small"><b>${esc(a.action)}</b></td><td class="xs muted">${esc(fmtMeta(a.meta))}</td></tr>`).join('') || '<tr><td colspan="5" class="muted">No activity yet.</td></tr>'}</tbody></table></div></div>`;
}

/* ---------- Rider ---------- */
function rView() {
  const r = api.rider(ui.riderId), jobs = api.riderJobs(actor());
  const cur = jobs.find(j => D_ACTIVE.includes(j.status)), done = jobs.filter(j => ['DELIVERED', 'FAILED'].includes(j.status));
  return `<div class="rwrap gutter stack-lg">
  <div class="rhead">${brandMark()}<div class="grow"><div class="logo-word" style="font-size:18px">RIDER</div><select id="riderpick" data-act-change="riderpick" aria-label="Signed in as">${S.riders.map(x => `<option value="${x.id}" ${x.id === ui.riderId ? 'selected' : ''}>${esc(x.name)} (sandbox)</option>`).join('')}</select></div><label class="switch" style="color:var(--char-ink)"><input type="checkbox" id="ronline" data-act-change="ronline" ${r.online ? 'checked' : ''}> ${r.online ? 'Online' : 'Offline'}</label></div>
  ${!r.online && !cur ? `<div class="card empty">You're offline. Go online to receive delivery offers.</div>` : ''}
  ${r.online && !cur ? `<div class="card empty">No jobs right now. Offers from dispatch appear here.</div>` : ''}
  ${cur ? riderJob(cur) : ''}
  <section class="stack"><div class="eyebrow">Completed jobs</div>${done.length ? done.map(j => `<div class="card row between small"><span class="mono" style="font-weight:700">${j.order.code}</span><span>${esc(j.order.barangay)}</span>${pill(j.status === 'DELIVERED' ? 'ok' : 'bad', DS[j.status])}<span class="xs muted">${fmtClock(j.endedAt)}</span></div>`).join('') : '<p class="small muted">None yet.</p>'}</section></div>`;
}
function riderJob(j) {
  const o = j.order, order = ['ACCEPTED', 'AT_STORE', 'COLLECTED', 'EN_ROUTE', 'ARRIVED', 'DELIVERED'];
  const idx = order.indexOf(j.status);

async function runStep(sc, quiet) {
  const st = scenState(sc.id); if (st.i >= sc.steps.length) return false;
  const [label, fn, opt] = sc.steps[st.i];
  try { fn(st.ctx); st.i++; if (!quiet) toast(label); }
  catch (e) { toast(e.message, true); return false; }
  if (opt && opt.waitFor) { if (ui.autopilot) ui.autopilot.step = opt.waitLabel; scheduleRender(); let n = 0; while (!opt.waitFor(st.ctx) && n++ < 120) { if (ui.autopilot && ui.autopilot.stop) break; await sleep(500); } }
  save(); scheduleRender(); return true;
}
async function autoplay(sc) {

  const ap = ui.autopilot; render();
  while (scenState(sc.id).i < sc.steps.length && !ap.stop) {
    ap.step = sc.steps[scenState(sc.id).i][0]; scheduleRender();
    const ok = await runStep(sc, true); if (!ok) break;
    await sleep(2600);
  }

  scheduleRender();
}

   ========================================================= */
const ingMap = () => Object.fromEntries(S.costing.ingredients.map(i => [i.id, i]));
function recipeCost(recipe, im) { let c = 0; for (const [id, q] of recipe || []) { const i = im[id]; if (i) c += i.costC * q; } return c; }
function costOf(p, cids = [], im = ingMap()) {
  let price = p.priceC;
  for (const g of p.groups) for (const c of g.choices) if (cids.includes(c.id)) price += c.deltaC;
  if (p.recipe) { let c = recipeCost(p.recipe, im); for (const g of p.groups) for (const x of g.choices) if (cids.includes(x.id) && x.recipe) c += recipeCost(x.recipe, im); return {costC: Math.round(c), priceC: price, method: 'recipe'}; }
  return {costC: Math.round(price * S.costing.estimatePct / 100), priceC: price, method: 'estimate'};
}
function idealPrice(costC) { const v = Math.ceil(costC / (S.costing.targetPct / 100) / 100); return (Math.ceil((v + 1) / 10) * 10 - 1) * 100; }
const pct = (a, b) => b ? Math.round(a / b * 1000) / 10 : 0;

/* Simulated sales history: SIMULATED, for showing how the analysis works. Weights are assumptions, not Hotwings data. */
const SIM_WEIGHTS = {w8: 14, w12: 10, w24: 4, w50: 1.2, cb4: 9, cb6: 8, tp2: 11, tp4: 6, 'tp-gbeef': 3, 'tp-cbeef': 3, 'bw-lumpia': 4, 'bw-siomai': 4, 'bw-pops': 5, 'bw-sisig': 5, 'pa-carb': 3, 'pa-spag': 3, 'pa-burger': 4, 'pa-trio': 1.5, 'sn-nachos': 3, 'sn-fries': 5, 'sn-cheese': 4, 'dr-lemon': 8, 'dr-4s': 4, 'dr-gulaman': 4, 'dr-pitcher': 2.5, 'rl-12': 1, 'rl-20': .6, 'rl-60': .15, 'pl-porksisig': .8, 'pl-chickensisig': .7, 'pl-bihon': .5, 'pl-sotanghon': .5, 'pl-beefsteak': .4, 'pl-garlicwings': .8, 'pl-pops': .5, 'pl-soup': .3, 'pl-carb': .4, 'pl-spag': .4, 'pl-rice': .9, 'bl-1': .25, 'bl-2': .2, 'bl-3': .2, 'tr-lumpia': .12, 'tr-pops': .1, 'tr-cajun': .08, 'tr-spag': .08, 'pk-1': .05, 'pk-2': .04, 'pm-chicken': .05, 'pm-pork': .04};
const FLAVOR_W = {teriyaki: 1.1, saltedegg: 1, sesamebbq: .8, blazing: 1.3, spicyparm: 1, honeyglaze: 1.1};
const HOUR_W = {10: 1, 11: 5, 12: 8, 13: 5, 14: 2, 15: 2, 16: 3, 17: 5, 18: 8, 19: 7, 20: 4};
const DOW_F = [1.2, .85, .85, .9, .95, 1.15, 1.3]; // Sun..Sat
function mulberry(a) { return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function wpick(r, entries) { const tot = entries.reduce((a, e) => a + e[1], 0); let x = r() * tot; for (const [k, w] of entries) { x -= w; if (x <= 0) return k; } return entries[entries.length - 1][0]; }
function manilaMidnight(t = Date.now()) { const d = new Date(t + 8 * 3600000); d.setUTCHours(0, 0, 0, 0); return d.getTime() - 8 * 3600000; }
let SIMCACHE = null;
function simSales() {
  if (SIMCACHE) return SIMCACHE;
  const r = mulberry(20240120), lines = [], today = manilaMidnight(), prods = Object.entries(SIM_WEIGHTS).filter(([id]) => api.product(id));
  for (let d = 30; d >= 1; d--) {
    const day = today - d * 86400000, dow = new Date(day + 8 * 3600000).getUTCDay();
    const n = Math.round(34 * DOW_F[dow] * (.85 + r() * .3));
    for (let k = 0; k < n; k++) {
      const hour = +wpick(r, Object.entries(HOUR_W)), at = day + hour * 3600000 + Math.floor(r() * 3600000), oid = 'sim' + d + '-' + k;
      const nl = 1 + (r() < .45 ? 1 : 0) + (r() < .15 ? 1 : 0);
      for (let j = 0; j < nl; j++) {
        const pid = wpick(r, prods), p = api.product(pid);
        const qty = p.minQty ? p.minQty + Math.floor(r() * 18) : p.cat === 'drinks' ? 1 + Math.floor(r() * 2) : 1;
        const cids = [];
        for (const g of p.groups) {
          if (g.id === 'flavor') { const k2 = Math.min(g.max || 1, 1 + Math.floor(r() * Math.min(g.max || 1, 3))); const pool = Object.entries(FLAVOR_W); while (cids.filter(c => FLAVOR_W[c]).length < k2) { const f = wpick(r, pool); if (!cids.includes(f)) cids.push(f); } }
          else cids.push(g.choices[Math.floor(r() * g.choices.length)].id);
        }
        lines.push({at, oid, pid, qty, cids});
      }
    }
  }
  return (SIMCACHE = lines);
}
function liveSales() {
  const out = [];
  for (const o of S.orders) { if (o.demoQueue || ['REJECTED', 'CANCELLED'].includes(o.status)) continue; for (const it of o.items) out.push({at: o.createdAt, oid: o.id, pid: it.productId, qty: it.qty, cids: it.options.map(x => x.cid).filter(Boolean), lineC: it.lineC}); }
  return out;
}
function salesData() {
  const sim = ui.anaSource !== 'live', lines = sim ? simSales() : liveSales(), im = ingMap();
  const days = sim ? 30 : Math.max(1, Math.ceil((Date.now() - Math.min(Date.now(), ...lines.map(l => l.at))) / 86400000));
  const by = {}; let rev = 0, cost = 0, estCost = 0;
  const orders = new Set(), flavors = {}, dow = [0, 0, 0, 0, 0, 0, 0], hour = {}, catRev = {};
  for (const l of lines) {
    const p = api.product(l.pid); if (!p) continue;
    const c = costOf(p, l.cids, im), lineRev = l.lineC ?? c.priceC * l.qty, lineCost = c.costC * l.qty;
    const b = by[p.id] || (by[p.id] = {p, qty: 0, revC: 0, costC: 0, method: c.method});
    b.qty += l.qty; b.revC += lineRev; b.costC += lineCost; rev += lineRev; cost += lineCost; if (c.method === 'estimate') estCost += lineCost;
    orders.add(l.oid); catRev[p.cat] = (catRev[p.cat] || 0) + lineRev;
    const dt = new Date(l.at + 8 * 3600000); dow[dt.getUTCDay()] += lineRev; hour[dt.getUTCHours()] = (hour[dt.getUTCHours()] || 0) + 1;
    for (const cid of l.cids) if (FLAVOR_W[cid] !== undefined) flavors[cid] = (flavors[cid] || 0) + l.qty;
  }
  return {sim, days, lines, items: Object.values(by).sort((a, b) => b.qty - a.qty), revC: rev, costC: cost, estCostC: estCost, orders: orders.size, flavors, dow, hour, catRev};
}
function ingredientUsage(lines, sinceDays) {
  const cut = Date.now() - sinceDays * 86400000, use = {};
  for (const l of lines) {
    if (l.at < cut) continue; const p = api.product(l.pid); if (!p || !p.recipe) continue;
    const rec = [...p.recipe]; for (const g of p.groups) for (const c of g.choices) if (l.cids.includes(c.id) && c.recipe) rec.push(...c.recipe);
    for (const [id, q] of rec) use[id] = (use[id] || 0) + q * l.qty;
  }
  return use;
}

/* ---------- UI helpers ---------- */
function hbars(rows, opt = {}) {
  const max = Math.max(1, ...rows.map(r => r.v));

}
function vbars(rows, h = 120) {
  const max = Math.max(1, ...rows.map(r => r.v));
  return `<div class="vb" style="height:${h + 34}px">${rows.map(r => `<div class="vb-c" title="${esc(r.label)}: ${esc(r.fmt)}"><span class="vb-v num">${esc(r.short ?? '')}</span><i style="height:${Math.max(2, r.v / max * h)}px"></i><span class="vb-l">${esc(r.label)}</span></div>`).join('')}</div>`;
}

function aDemand(D) {
  if (!D.lines.length) return '';
  const top = D.items.slice(0, 12), byRev = D.items.slice().sort((a, b) => b.revC - a.revC);
  let cum = 0; const abc = byRev.map(i => { cum += i.revC; const share = cum / D.revC; return {...i, cls: share <= .8 ? 'A' : share <= .95 ? 'B' : 'C'}; });
  const nA = abc.filter(i => i.cls === 'A').length;
  const fl = FLAVORS.map(f => ({label: f.label, v: D.flavors[f.id] || 0})).sort((a, b) => b.v - a.v), flTot = fl.reduce((a, b) => a + b.v, 0) || 1;
  const spicy = FLAVORS.filter(f => f.spicy).reduce((a, f) => a + (D.flavors[f.id] || 0), 0);
  const cats = S.categories.map(c => ({label: c.label, v: D.catRev[c.id] || 0})).filter(c => c.v).sort((a, b) => b.v - a.v);
  const dn = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'], weeks = D.days / 7;
  const hours = Object.keys(HOUR_W).map(h => ({label: (h % 12 || 12) + (h < 12 ? 'a' : 'p'), v: D.hour[h] || 0, fmt: (D.hour[h] || 0) + ' lines', short: ''}));
  // menu engineering
  const me = menuEngineering(D);

function menuEngineering(D) {
  const it = D.items.filter(i => i.qty >= 3 && !['trays', 'packages', 'bilao', 'packed'].includes(i.p.cat)); if (it.length < 4) return '';
  const totQ = it.reduce((a, b) => a + b.qty, 0), popCut = 0.7 / it.length;
  const avgCM = it.reduce((a, b) => a + (b.revC - b.costC), 0) / totQ;
  const rows = it.map(i => { const cm = (i.revC - i.costC) / i.qty, hp = i.qty / totQ >= popCut, hm = cm >= avgCM; return {...i, cm, cls: hp && hm ? 'Star' : hp ? 'Plowhorse' : hm ? 'Puzzle' : 'Dog'}; });
  const W = 520, H = 300, pad = 44, maxQ = Math.max(...rows.map(r => r.qty)), maxCM = Math.max(...rows.map(r => r.cm)), minCM = Math.min(0, ...rows.map(r => r.cm));
  const lx = q => pad + Math.log10(q + 1) / Math.log10(maxQ + 1) * (W - pad - 12), ly = c => H - pad + 6 - (c - minCM) / (maxCM - minCM || 1) * (H - pad - 16);
  const cx = lx(popCut * totQ), cy = ly(avgCM), label = new Set(rows.slice(0, 6).map(r => r.p.id));
  const tone = {Star: 'ok', Plowhorse: 'warn', Puzzle: 'info', Dog: 'bad'}, advice = {Star: 'Keep. Protect quality and visibility.', Plowhorse: 'Popular but thin margin. Trim recipe cost or nudge the price.', Puzzle: 'Good margin, low demand. Promote or reposition.', Dog: 'Low demand and margin. Review or drop.'};
  const svg = `<svg viewBox="0 0 ${W} ${H}" class="me" role="img" aria-label="Menu engineering scatter: popularity versus unit margin">
   <line x1="${pad}" y1="${H - pad + 6}" x2="${W - 8}" y2="${H - pad + 6}" class="ax"/><line x1="${pad}" y1="8" x2="${pad}" y2="${H - pad + 6}" class="ax"/>
   <line x1="${cx}" y1="8" x2="${cx}" y2="${H - pad + 6}" class="qd"/><line x1="${pad}" y1="${cy}" x2="${W - 8}" y2="${cy}" class="qd"/>
   <text x="${W - 12}" y="20" text-anchor="end" class="ql">STARS</text><text x="${pad + 6}" y="20" class="ql">PUZZLES</text><text x="${W - 12}" y="${H - pad - 2}" text-anchor="end" class="ql">PLOWHORSES</text><text x="${pad + 6}" y="${H - pad - 2}" class="ql">DOGS</text>
   <text x="${(W + pad) / 2}" y="${H - 8}" text-anchor="middle" class="at">Units sold (log scale) →</text><text x="12" y="${(H - pad) / 2}" transform="rotate(-90 12 ${(H - pad) / 2})" text-anchor="middle" class="at">Margin per unit →</text>
   ${rows.map(r => `<g><circle cx="${lx(r.qty).toFixed(1)}" cy="${ly(r.cm).toFixed(1)}" r="5" class="pt"><title>${esc(r.p.name)}: ${r.qty} sold, ${peso(r.cm)} margin each (${r.cls})</title></circle>${label.has(r.p.id) ? `<text x="${lx(r.qty) > W - 150 ? lx(r.qty) - 8 : lx(r.qty) + 8}" text-anchor="${lx(r.qty) > W - 150 ? 'end' : 'start'}" y="${ly(r.cm) - 7}" class="pl">${esc(r.p.name.replace('Chicken Wings, ', 'Wings '))}</text>` : ''}</g>`).join('')}</svg>`;
  const groups = ['Star', 'Plowhorse', 'Puzzle', 'Dog'].map(c => [c, rows.filter(r => r.cls === c).sort((a, b) => b.qty - a.qty)]);
  return `<section class="card stack"><h2 class="h2">Menu engineering: popularity × margin</h2><p class="small muted">Each dot is an à la carte item with at least 3 sales (trays, packages and bundles are left out). Lines mark 70% of average popularity and the average margin per unit. Margins use the costs in “Costs & assumptions”; items marked EST. use a flat ${S.costing.estimatePct}% food-cost estimate.</p>
  <div style="overflow-x:auto">${svg}</div>
  <div class="sgrid">${groups.map(([c, list]) => `<div class="stack" style="gap:6px"><div class="row">${pill(tone[c], c + 's')}<span class="xs muted">${list.length} items</span></div><p class="xs muted">${advice[c]}</p><p class="small">${list.slice(0, 6).map(r => esc(r.p.name)).join(', ') || '—'}${list.length > 6 ? ` +${list.length - 6} more` : ''}</p></div>`).join('')}</div></section>`;
}

function aPrice(D) {
  const im = ingMap(), sold = Object.fromEntries(D.items.map(i => [i.p.id, i]));
  const rows = S.products.filter(p => p.active).map(p => { const c = costOf(p, [], im); const fc = pct(c.costC, p.priceC), ideal = idealPrice(c.costC); return {p, c, fc, margin: p.priceC - c.costC, ideal}; });
  const rc = rows.filter(r => r.c.method === 'recipe'), over = rc.filter(r => r.fc > S.costing.targetPct + 5), wfc = pct(D.costC, D.revC);
  const verdict = r => r.c.method !== 'recipe' ? pill('mute', 'Add recipe cost') : r.fc > S.costing.targetPct + 5 ? pill('bad', 'Raise to ' + peso(r.ideal).replace('.00', '')) : r.fc < S.costing.targetPct - 10 ? pill('ok', 'Strong margin') : pill('info', 'On target');
  // price ladders
  const per = (id, n) => ({p: api.product(id), n, unit: api.product(id).priceC / n});
  const ladder = (title, list, unitName) => { const L = list.map(([id, n]) => per(id, n)); const flags = []; for (let i = 1; i < L.length; i++) if (L[i].unit > L[i - 1].unit + 1) { const fair = Math.floor(L[i - 1].unit * L[i].n * 0.98 / 1000) * 1000 - 100; flags.push(`<b>${esc(L[i].p.name)}</b> costs more per ${unitName} (${peso(L[i].unit)}) than <b>${esc(L[i - 1].p.name)}</b> (${peso(L[i - 1].unit)}). Bigger orders get no bulk saving. Consider ${peso(fair).replace('.00', '')}.`); }
    return `<section class="card stack"><h2 class="h2">${title}</h2><div class="tbl-wrap"><table><thead><tr><th>Item</th><th class="r">Price</th><th class="r">Per ${unitName}</th></tr></thead><tbody>${L.map(x => `<tr><td>${esc(x.p.name)}</td><td class="r num">${peso(x.p.priceC)}</td><td class="r num">${peso(x.unit)}</td></tr>`).join('')}</tbody></table></div>${flags.length ? flags.map(f => `<div class="notice n-warn"><div>${f}</div></div>`).join('') : '<p class="small muted">Per-unit price falls as quantity rises. The ladder is consistent.</p>'}</section>`; };
  const pkgs = [['pk-1', [['w24'], ['tr-sotanghon'], ['tr-spag'], ['tr-lumpia']]], ['pk-2', [['w24'], ['tr-sotanghon'], ['tr-spag'], ['tr-lumpia'], ['tr-beefsteak']]], ['pk-3', [['w24'], ['tr-sotanghon'], ['tr-spag'], ['tr-lumpia'], ['tr-beefsteak'], ['tr-kaldereta'], ['tr-chopsuey']]], ['pk-4', [['w24'], ['tr-sotanghon'], ['tr-spag'], ['tr-lumpia'], ['tr-beefsteak'], ['tr-kaldereta'], ['tr-chopsuey'], ['tr-cajun']]]]
    .map(([id, parts]) => { const p = api.product(id), sum = parts.reduce((a, [pid]) => a + api.product(pid).priceC, 0); return {p, sum, save: sum - p.priceC}; });
  return `<div class="kpis">${kpi('Target food cost', S.costing.targetPct + '%', 'Common PH benchmark: 28–35%')}${kpi('Weighted food cost', wfc + '%', 'From sales mix, ' + pct(D.estCostC, D.costC) + '% of cost estimated')}${kpi('Recipe-costed items', rc.length + ' of ' + rows.length, 'Others use a ' + S.costing.estimatePct + '% estimate')}${kpi('Above target', over.length + ' items', 'Food cost over ' + (S.costing.targetPct + 5) + '%')}</div>
  <div class="notice n-info"><div><b>How the ideal price works.</b> Ideal price = recipe cost ÷ ${S.costing.targetPct}% target food cost, rounded up to a price ending in 9. Costs come from the ingredient table under “Costs & assumptions”. Replace them with your real purchase prices to get real recommendations.</div></div>
  ${over.length ? `<div class="notice n-bad"><div><b>${over.length} items are above the ${S.costing.targetPct + 5}% food-cost line</b> at the current ingredient costs: ${over.slice(0, 6).map(r => esc(r.p.name)).join(', ')}${over.length > 6 ? '…' : ''}. Wing items are the most sensitive: each ₱1 change in cost per wing piece moves an 8 pc order's cost by ₱8.</div></div>` : ''}
  <section class="stack"><h2 class="h2">Price per item</h2><div class="tbl-wrap"><table><thead><tr><th>Item</th><th class="r">Price</th><th class="r">Unit cost</th><th class="r">Food cost</th><th class="r">Margin</th><th class="r">Ideal price</th><th class="r">Sold (${D.days}d)</th><th>Recommendation</th></tr></thead><tbody>
  ${S.categories.map(cat => { const rs = rows.filter(r => r.p.cat === cat.id); return rs.length ? `<tr><th colspan="8" style="background:var(--surface)">${esc(cat.label)}</th></tr>` + rs.map(r => `<tr><td>${esc(r.p.name)}</td><td class="r num">${peso(r.p.priceC)}</td><td class="r num">${peso(r.c.costC)} ${methodTag(r.c.method)}</td><td class="r num" style="${r.c.method === 'recipe' && r.fc > S.costing.targetPct + 5 ? 'color:var(--bad);font-weight:700' : ''}">${r.fc}%</td><td class="r num">${peso(r.margin)}</td><td class="r num">${r.c.method === 'recipe' ? peso(r.ideal) : '—'}</td><td class="r num">${sold[r.p.id]?.qty || 0}</td><td>${verdict(r)}</td></tr>`).join('') : ''; }).join('')}

function aIncome(D) {
  const c = S.costing, opex = Object.values(c.opex).reduce((a, b) => a + b, 0) * 100;
  const dRev = D.revC / D.days, dCost = D.costC / D.days, gm = D.revC ? 1 - D.costC / D.revC : 0, g = c.growthPct / 100;
  const month = (m, vol) => { const rev = dRev * 30 * Math.pow(1 + g, m) * vol, gp = rev * gm; return {rev, gp, net: gp - opex}; };
  const sc = [['Low', .85], ['Base', 1], ['High', 1.15]].map(([n, v]) => { const ms = Array.from({length: 12}, (_, m) => month(m, v)); return {n, v, m1: ms[0], yr: ms.reduce((a, b) => ({rev: a.rev + b.rev, gp: a.gp + b.gp, net: a.net + b.net}), {rev: 0, gp: 0, net: 0})}; });
  const base = Array.from({length: 12}, (_, m) => month(m, 1)), mn = new Date(Date.now() + 8 * 3600000);
  const labels = base.map((_, m) => new Date(Date.UTC(mn.getUTCFullYear(), mn.getUTCMonth() + 1 + m, 1)).toLocaleString('en-PH', {month: 'short', timeZone: 'UTC'}));
  const be = gm ? opex / 30 / gm : 0;
  return `<div class="kpis">${kpi('Avg daily revenue', pesoK(dRev), `${(D.orders / D.days).toFixed(1)} orders × ${peso(D.revC / Math.max(1, D.orders))}`)}${kpi('Gross margin', pct(D.revC - D.costC, D.revC) + '%', 'After food & packaging cost')}${kpi('Monthly fixed costs', pesoK(opex), 'Rent, staff, utilities, LPG, other')}${kpi('Break-even sales', pesoK(Math.round(be / 1000) * 1000) + ' a day', `${(be / Math.max(1, D.revC / D.orders)).toFixed(0)} orders a day at the current ticket`)}</div>
  <section class="card stack"><h2 class="h2">Base case: monthly revenue, next 12 months</h2>${vbars(base.map((b, i) => ({label: labels[i], v: b.rev, fmt: `Revenue ${pesoK(b.rev)} · net ${pesoK(b.net)}`, short: pesoK(b.rev)})), 130)}<p class="small">Assumes ${c.growthPct}% monthly growth from today's daily average. Change growth and costs in “Costs & assumptions”.</p></section>
  <section class="stack"><h2 class="h2">Scenarios</h2><div class="tbl-wrap"><table><thead><tr><th>Scenario</th><th class="r">Volume</th><th class="r">Next month revenue</th><th class="r">Next month gross profit</th><th class="r">Next month net</th><th class="r">12-month revenue</th><th class="r">12-month net</th></tr></thead><tbody>${sc.map(s => `<tr><td><b>${s.n}</b></td><td class="r num">${Math.round(s.v * 100)}%</td><td class="r num">${pesoK(s.m1.rev)}</td><td class="r num">${pesoK(s.m1.gp)}</td><td class="r num" style="${s.m1.net < 0 ? 'color:var(--bad);font-weight:700' : ''}">${pesoK(s.m1.net)}</td><td class="r num">${pesoK(s.yr.rev)}</td><td class="r num" style="${s.yr.net < 0 ? 'color:var(--bad);font-weight:700' : ''}">${pesoK(s.yr.net)}</td></tr>`).join('')}</tbody></table></div>
  <p class="xs muted">Net = gross profit − fixed costs, before tax, delivery rider pay and card or e-wallet fees. Gross margin uses recipe costs where available and a ${c.estimatePct}% estimate elsewhere. ${D.sim ? 'Built on simulated sales, so treat as a model, not a forecast.' : ''}</p></section>
  <section class="card stack"><h2 class="h2">What moves profit most</h2><div class="tbl-wrap"><table><thead><tr><th>Change</th><th class="r">Effect on monthly net (base)</th></tr></thead><tbody>
   <tr><td>+5 orders a day at the current ticket</td><td class="r num">${pesoK(5 * (D.revC / Math.max(1, D.orders)) * 30 * gm)}</td></tr>
   <tr><td>+₱10 on every wing set (8, 12, 24, 50 pcs)</td><td class="r num">${pesoK(['w8', 'w12', 'w24', 'w50'].reduce((a, id) => a + (D.items.find(i => i.p.id === id)?.qty || 0), 0) / D.days * 30 * 1000)}</td></tr>

}

function bake(img, e, size) {
  const c = document.createElement('canvas'); c.width = c.height = size; const g = c.getContext('2d');

function fromHash() {
  const h = location.hash.slice(1); const v = VIEWS.includes(h) ? h : null;
  if (v) {
    if (v.startsWith('staff-') && !STAFF.includes(ui.role)) ui.role = 'cashier';
    if (v === 'rider') ui.role = 'rider';
    if (['home', 'menu', 'cart', 'checkout', 'track', 'help'].includes(v)) ui.role = 'customer';

  pause: () => wrap(() => api.setStore(actor(), {paused: !S.store.paused})),
  payok: el => wrap(() => { api.verifyPayment(actor(), el.dataset.id, true); toast('Payment verified. Kitchen can accept the order.'); }),
  payreject: el => { if (el.dataset.confirm) wrap(() => { api.verifyPayment(actor(), el.dataset.id, false, $('#payreason').value); ui.modal = null; toast('Rejection sent to customer.'); }); else { ui.modal = {type: 'none', rejectPay: el.dataset.id}; render(); } },
  editprod: el => { ui.modal = {type: 'prodedit', id: el.dataset.id || null}; render(); },
  stock: el => { ui.modal = {type: 'stock', id: el.dataset.id}; render(); },
  untrack: () => wrap(() => { api.untrackStock(actor(), ui.modal.id); ui.modal = null; }),
  hist: el => { ui.modal = {type: 'hist', id: el.dataset.id}; render(); },
  copycsv: () => { const t = $('#csvbox'); const done = () => toast('CSV copied.'); try { navigator.clipboard.writeText(t.value).then(done, () => { t.select(); toast('Press Ctrl+C or ⌘C to copy the selected text.'); }); } catch (e) { t.select(); } },
  rstat: el => wrap(() => { api.riderStatus(actor(), el.dataset.id, el.dataset.to); toast(DS[el.dataset.to]); }),
  share: el => wrap(() => api.setSharing(actor(), el.dataset.id, el.dataset.m)),
  gpspause: el => { const d = S.deliveries.find(x => x.id === el.dataset.id); wrap(() => api.setGpsPaused(actor(), el.dataset.id, !d.gpsPaused)); },
  rfail: el => wrap(() => { api.riderStatus(actor(), el.dataset.id, 'FAILED', {reason: $('#failreason').value}); toast('Delivery marked failed. Dispatch has been told.'); }),
};
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]'); if (!el) return;
  const fn = ACT[el.dataset.act]; if (!fn) return;
  if (el.dataset.self && e.target !== el) return;
  fn(el, e);
});
document.addEventListener('keydown', e => { if (e.key === 'Escape') { if (ui.modal) { ui.modal = null; render(); } else if (ui.guide) { ui.guide = false; render(); } } });

const CHANGE = {
  opt: el => { const m = ui.modal, g = api.product(m.id).groups.find(g => g.id === el.dataset.g); let cur = m.sel[g.id] || []; if (g.type === 'single') cur = [el.dataset.c]; else { cur = el.checked ? [...cur, el.dataset.c] : cur.filter(x => x !== el.dataset.c); if (g.max && cur.length > g.max) { cur = cur.slice(0, g.max); el.checked = false; toast(`Pick up to ${g.max}.`); } } m.sel[g.id] = cur; render(); },
  sound: el => { ui.sound = el.checked; if (ui.sound) { try { actx = actx || new (window.AudioContext || window.webkitAudioContext)(); beep(); } catch (e) {} } render(); },
  av: el => wrap(() => { api.setAvailability(actor(), el.dataset.id, el.value); toast('Availability updated. Customers see it now.'); }),
  choice: el => wrap(() => api.setChoice(actor(), el.dataset.id, el.dataset.g, el.dataset.c, el.checked)),
  store: el => wrap(() => api.setStore(actor(), {[el.dataset.k]: el.checked})),
  zone: el => wrap(() => api.setZone(actor(), el.dataset.id, {[el.dataset.k]: el.dataset.k === 'enabled' ? el.checked : Math.round(Number(el.value) * 100)})),
  offline: el => { ui.offline = el.checked; render(); },
  logo: el => pickNew('logo', el.files && el.files[0]),
  photo: el => pickNew(el.dataset.id, el.files && el.files[0]),
  uppick: el => pickNew(el.dataset.t, el.files && el.files[0]),
  edfile: el => { const f = el.files && el.files[0], t = ui.modal.target; fileToData(f, 900, false).then(src => { ui.modal.src = src; ui.modal.edit = EDIT0(t === 'logo' ? 'contain' : 'cover'); render(); }, e => toast(e.message, true)); },
  costset: el => wrap(() => api.setCosting(actor(), {[el.dataset.k]: el.value})),
  opex: el => wrap(() => api.setCosting(actor(), {opex: {[el.dataset.k]: el.value}})),
  ing: el => wrap(() => api.setIngredient(actor(), el.dataset.id, {[el.dataset.k]: el.dataset.k === 'costC' ? Math.round(Number(el.value) * 100) : el.value})),
  riderpick: el => { ui.riderId = el.value; save(); render(); },
  ronline: el => wrap(() => api.setOnline(actor(), el.checked)),
  proof: el => { const f = el.files && el.files[0]; if (!f) return; const rd = new FileReader(); rd.onload = () => { const img = new Image(); img.onload = () => { const c = document.createElement('canvas'), s = 160 / Math.max(img.width, img.height); c.width = Math.round(img.width * s); c.height = Math.round(img.height * s); c.getContext('2d').drawImage(img, 0, 0, c.width, c.height); ui.gcashProof = c.toDataURL('image/jpeg', .7); render(); }; img.onerror = () => toast("That file isn't an image we can read.", true); img.src = rd.result; }; rd.readAsDataURL(f); },
};
document.addEventListener('change', e => {
  const el = e.target;
  if (el.dataset.actChange && CHANGE[el.dataset.actChange]) return CHANGE[el.dataset.actChange](el);
  if (el.dataset.bind) { bind(el); if (el.dataset.rerender || el.type === 'checkbox' || el.type === 'radio') { if (el.dataset.bind === 'draft.barangay') { const z = S.zones.find(z => z.id === el.value); if (z && (!ui.draft.pin || dist(ui.draft.pin, z.c) > 60)) ui.draft.pin = {...z.c}; } render(); } }
});
document.addEventListener('input', e => {
  const el = e.target;
  if (el.dataset.ed && ui.modal && ui.modal.type === 'photoed') { const k = el.dataset.ed, v = Number(el.value); ui.modal.edit[k] = k === 'zoom' ? v / 100 : v; const lab = document.getElementById(el.id + '-v'); if (lab) lab.textContent = k === 'zoom' ? v + '%' : v + '%'; drawEditor(); return; } if (!el.dataset.bind || el.type === 'radio' || el.type === 'checkbox') return;
  bind(el);
  if (el.dataset.bind === 'menuSearch' || el.dataset.bind === 'staffSearch') { $('#app').innerHTML = renderView(); const n = document.getElementById(el.id); if (n) { n.focus(); n.setSelectionRange(n.value.length, n.value.length); } }
  if (el.dataset.bind.startsWith('draft.') && ui.view === 'checkout') { const w = $('#quote-wrap'), q = cartQuote(); if (w) w.innerHTML = quoteBox(q); const b = $('#placebtn'); if (b) b.disabled = q.blocking || ui.placing || ui.offline; }
});
function bind(el) {
  const path = el.dataset.bind, v = el.type === 'checkbox' ? el.checked : el.value;
  if (path.startsWith('draft.')) { ui.draft[path.slice(6)] = v; save(); }
  else if (path.startsWith('modal.')) { if (ui.modal) ui.modal[path.slice(6)] = v; }
  else ui[path] = v;
}
document.addEventListener('submit', e => {
  const f = e.target, kind = f.dataset.form; if (!kind) return; e.preventDefault();
  const fd = Object.fromEntries(new FormData(f));
  if (kind === 'lookup') wrap(() => { const r = api.lookup(fd.code, fd.phone); if (!ui.myOrders.some(m => m.code === r.code)) ui.myOrders.push(r); ui.trackCode = r.code; });
  if (kind === 'gcash') wrap(() => { api.submitGcashProof(ui.trackCode, myToken(ui.trackCode), fd.ref, ui.gcashProof); ui.gcashRef = ''; ui.gcashProof = null; toast('Payment details sent. The store will check them.'); });
  if (kind === 'product') wrap(() => { api.updateProduct(actor(), ui.modal.id, fd); ui.modal = null; toast('Menu item saved.'); });
  if (kind === 'stock') wrap(() => { api.setStock(actor(), ui.modal.id, fd.n); ui.modal = null; toast('Stock updated.'); });
  if (kind === 'store') wrap(() => { const p = {staffOnDuty: fd.staffOnDuty, maxActive: fd.maxActive}; if (/^\d{1,2}:\d{2}$/.test(fd.open)) p.open = fd.open; if (/^\d{1,2}:\d{2}$/.test(fd.close)) p.close = fd.close; api.setStore(actor(), p); toast('Saved.'); });
  if (kind === 'pod') wrap(() => { const j = api.riderJobs(actor()).find(x => x.id === f.dataset.id); if (j.order.collectC && !fd.cash) throw new ApiError(422, `Confirm you collected ${peso(j.order.collectC)} cash.`); api.riderStatus(actor(), f.dataset.id, 'DELIVERED', {pin: fd.pin}); toast('Delivered. Hand the cash to the store.'); });
});
window.addEventListener('offline', () => { ui.offline = true; render(); });
window.addEventListener('online', () => { ui.offline = false; render(); });

/* boot */
load();
if (navigator.onLine === false) ui.offline = true;
fromHash();
setInterval(simTick, 4000);
window.__hw = {api: () => api, runChecks: () => { runChecks(); return ui.checks; }, ui};
</script>
</body>
</html>
